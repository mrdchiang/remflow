<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:11434;">
<title>RemFlow — Remediation Intelligence</title>
<style>
:root {
  --bg-root: #060b18; --bg-surface: #0c1225; --bg-elevated: #111830;
  --bg-hover: #182040; --bg-sidebar: #080e1c;
  --border: #1a2540; --border-light: #243055;
  --text-primary: #e8ecf4; --text-secondary: #8899bb; --text-muted: #556888;
  --accent: #0066ff; --accent-dim: #0052cc; --accent-glow: rgba(0,102,255,0.25);
  --critical: #ff4444; --critical-bg: #351520;
  --high: #ff7722; --high-bg: #352215;
  --medium: #e6b800; --medium-bg: #353015;
  --low: #22cc66; --low-bg: #123020;
  --installed: #22cc66; --installed-bg: #123020;
  --pending: #ff7722; --pending-bg: #352215;
  --failed: #ff4444; --failed-bg: #351520;
  --radius-sm: 6px; --radius: 8px; --radius-lg: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --sidebar-w: 240px; --topbar-h: 56px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "Fira Code", Consolas, monospace;
}
[data-theme="light"] {
  --bg-root: #f0f2f8; --bg-surface: #fff; --bg-elevated: #f5f7fc;
  --bg-hover: #eef1f8; --bg-sidebar: #e8ecf4;
  --border: #d8dde8; --border-light: #e8ecf4;
  --text-primary: #0c1225; --text-secondary: #556888; --text-muted: #8899bb;
  --accent: #0052cc; --accent-dim: #003d99;
  --critical-bg: #fff0f0; --high-bg: #fff4ee; --medium-bg: #fffbe6; --low-bg: #eefff4;
  --rollback-bg: #fff0f0; --rollback-border: #e8cccc;
  --installed-bg: #eefff4; --pending-bg: #fff4ee; --failed-bg: #fff0f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;color:var(--text-primary);background:var(--bg-root);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
th,td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:var(--bg-hover)}
.app{display:flex;height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;z-index:10;transition:width .2s}
.sidebar.collapsed{width:56px}
.sidebar-brand{padding:18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);height:var(--topbar-h);flex-shrink:0}
.sidebar-brand .logo{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 0 12px var(--accent-glow)}
.sidebar-brand .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .title,.sidebar.collapsed .section-label,.sidebar.collapsed .nav-item span:not(.icon),.sidebar.collapsed .user-info,.sidebar.collapsed .sidebar-footer .user-info{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px}
.sidebar-nav{padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:2px}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:12px 12px 6px;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary);text-decoration:none}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow)}
.nav-item .icon{width:20px;text-align:center;flex-shrink:0;font-size:15px}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar-footer .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.sidebar-footer .user-name{font-weight:600}
.sidebar-footer .user-role{color:var(--text-muted);font-size:11px}
.sidebar.collapsed .sidebar-footer{justify-content:center}
.sidebar.collapsed .sidebar-footer .user-info{display:none}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar-h);background:var(--bg-surface);border-bottom:1px solid var(--border);border-top:2px solid var(--accent);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.topbar .hamburger{background:none;border:none;color:var(--text-secondary);font-size:18px;padding:4px;border-radius:var(--radius-sm)}
.topbar .hamburger:hover{background:var(--bg-hover);color:var(--text-primary)}
.topbar .page-title{font-size:18px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.topbar-info{color:var(--text-muted);font-size:12px}
.theme-toggle,.tm-toggle{background:var(--bg-hover);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-secondary);padding:6px 10px;font-size:15px}
.theme-toggle:hover,.tm-toggle:hover{color:var(--text-primary);border-color:var(--border-light)}
.page{display:none;padding:24px;overflow-y:auto;flex:1}
.page.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:border-color .2s;cursor:pointer}
.stat-card:hover{border-color:var(--accent)}
.stat-card .stat-value{font-size:32px;font-weight:700;margin-bottom:4px}
.stat-card .stat-label{font-size:13px;color:var(--text-secondary)}
.stat-card .stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-secondary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.text-link{color:var(--accent);cursor:pointer}
.text-link:hover{text-decoration:underline}
.mono{font-family:var(--font-mono);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-critical{background:var(--critical-bg);color:var(--critical)}
.badge-high{background:var(--high-bg);color:var(--high)}
.badge-medium{background:var(--medium-bg);color:var(--medium)}
.badge-low{background:var(--low-bg);color:var(--low)}
.badge-success{background:#123020;color:#22cc66}
.badge-warning{background:#353015;color:#e6b800}
.badge-info{background:#102830;color:#00aacc}
.badge-pending{background:var(--pending-bg);color:var(--pending)}
.badge-installed{background:var(--installed-bg);color:var(--installed)}
.badge-failed{background:var(--failed-bg);color:var(--failed)}
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);font-size:13px;font-weight:500;transition:all .15s}
.btn:hover{border-color:var(--accent);background:var(--bg-hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dim)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--bg-hover);border-color:var(--border)}
.btn-group{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-input{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);padding:8px 12px;font-size:13px;width:280px;font-family:inherit}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-input::placeholder{color:var(--text-muted)}
.filter-select{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);padding:7px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.filter-group{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ml-auto{margin-left:auto}
.mt-12{margin-top:12px}
.mb-12{margin-bottom:12px}
.flex{display:flex;align-items:center;gap:8px}
.flex-wrap{flex-wrap:wrap}
.gap-8{gap:8px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0}
.chart-bar-item{flex:1;border-radius:var(--radius-sm) var(--radius-sm) 0 0;min-height:4px;position:relative;transition:height .3s}
.chart-bar-item .chart-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-muted);white-space:nowrap}
.progress-bar{height:8px;background:var(--bg-hover);border-radius:4px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.clickable{cursor:pointer}
.clickable:hover td{background:var(--bg-hover)!important}

/* ── Data Sources: Drop Zones ──────────────────────────── */
.drop-zone{
  border:2px dashed var(--border-light);
  border-radius:var(--radius-lg);
  padding:40px 20px;
  text-align:center;
  background:var(--bg-elevated);
  transition:all .2s;
  cursor:pointer;
  margin-bottom:16px;
}
.drop-zone:hover,.drop-zone.drag-over{
  border-color:var(--accent);
  background:var(--bg-hover);
  box-shadow:0 0 16px var(--accent-glow);
}
.drop-zone .dz-icon{font-size:36px;margin-bottom:8px;display:block}
.drop-zone .dz-title{font-weight:600;color:var(--text-primary);margin-bottom:4px}
.drop-zone .dz-sub{font-size:12px;color:var(--text-muted)}
.drop-zone .dz-hint{font-size:11px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)}
.import-summary{
  background:var(--bg-elevated);
  border:1px solid var(--accent);
  border-radius:var(--radius-lg);
  padding:16px 20px;
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.import-summary .is-stat{text-align:center;min-width:80px}
.import-summary .is-val{font-size:22px;font-weight:700}
.import-summary .is-lbl{font-size:11px;color:var(--text-muted)}

/* ── Deployment status colors ─────────────────────────── */
.deployment-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;width:100%;margin:2px 0}
.deployment-bar .db-installed{background:var(--installed)}
.deployment-bar .db-pending{background:var(--pending)}
.deployment-bar .db-failed{background:var(--failed)}
.deployment-tooltip{font-size:10px;color:var(--text-muted);white-space:nowrap}
.shieldview-banner{
  background:var(--accent-glow);
  border:1px solid var(--accent);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:12px;
}

/* ── KB / PowerShell Code Blocks ─────────────────────── */
.ps-code-block {
  background: #0a0f1c;
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 8px 0;
  position: relative;
}
.ps-code-block .ps-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg-hover);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.ps-code-block .ps-header .ps-label {
  font-weight: 600;
  color: var(--accent);
  font-family: var(--font-mono);
}
.ps-code-block .ps-header .copy-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  padding: 3px 8px;
  font-size: 10px;
  cursor: pointer;
  transition: all .15s;
}
.ps-code-block .ps-header .copy-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.ps-code-block .ps-header .copy-btn.copied {
  background: var(--low);
  border-color: var(--low);
  color: #fff;
}
.ps-code-block pre {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: #c0d0e0;
  white-space: pre;
  max-height: 400px;
  overflow-y: auto;
}
.ps-code-block pre .comment { color: #6a8a6a; }
.ps-code-block pre .keyword { color: #5599dd; }
.ps-code-block pre .string { color: #ce9a6e; }
.ps-code-block pre .cmdlet { color: #ddcc66; }
.ps-code-block pre .param { color: #88bbdd; }
.ps-code-block .ps-toggle {
  cursor: pointer;
  user-select: none;
}
.ps-code-block.collapsed pre { display: none; }
/* ── Rollback Code Block ───────────────────────────────── */
.ps-code-block.rollback {
  background: #0d0808;
  border-color: #552222;
}
.ps-code-block.rollback .ps-header {
  background: #1a1010;
  border-bottom-color: #552222;
}
.ps-code-block.rollback .ps-header .ps-label {
  color: #ff6666;
}
.ps-code-block.rollback pre {
  color: #d4a0a0;
}
.ps-code-block.rollback .ps-header .copy-btn {
  background: #1a1010;
  border-color: #552222;
}
.ps-code-block.rollback .ps-header .copy-btn:hover {
  background: #552222;
  border-color: #772222;
}
.ps-code-block.rollback .copy-btn.copied {
  background: #223322;
  border-color: var(--low);
  color: var(--low);
}
.rollback-unavailable {
  background: #1a1010;
  border: 1px solid #552222;
  border-radius: var(--radius);
  padding: 12px 16px;
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: #cc8888;
}
.rollback-unavailable .ru-icon { font-size: 20px; }
.rollback-unavailable .ru-reason { color: #995555; font-size: 12px; }
.kb-badge {
  display: inline-block;
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  transition: all .15s;
}
.kb-badge:hover {
  background: var(--accent);
  color: #fff;
}

/* ── AI Remediation Chat Panel ────────────────────────── */
.ai-panel-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 2000;
  display: none;
}
.ai-panel-overlay.open { display: block; }
.ai-panel {
  position: fixed;
  top: 0; right: -480px;
  width: 440px; max-width: 95vw;
  height: 100vh;
  background: var(--bg-elevated);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 2001;
  transition: right .3s ease;
  box-shadow: -4px 0 24px rgba(0,0,0,0.4);
}
.ai-panel.open { right: 0; }
.ai-panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  background: var(--bg-surface);
}
.ai-panel-header .ai-title {
  font-weight: 700;
  font-size: 15px;
  flex: 1;
}
.ai-panel-header .close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
}
.ai-panel-header .close-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.ai-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ai-chat-bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  line-height: 1.55;
  max-width: 90%;
  word-wrap: break-word;
}
.ai-chat-bubble.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.ai-chat-bubble.assistant {
  align-self: flex-start;
  background: var(--bg-hover);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-bottom-left-radius: 4px;
}
.ai-chat-bubble.assistant pre {
  background: #0a0f1c;
  padding: 10px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  overflow-x: auto;
  margin: 8px 0;
  white-space: pre-wrap;
}
.ai-chat-bubble.assistant strong { color: var(--accent); }
.ai-chat-bubble.system-msg {
  align-self: center;
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  text-align: center;
  max-width: 100%;
  padding: 4px 12px;
}
.ai-panel-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  background: var(--bg-surface);
}
.ai-panel-footer textarea {
  flex: 1;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  padding: 8px 10px;
  font-size: 12px;
  font-family: inherit;
  resize: none;
  min-height: 40px;
  max-height: 100px;
}
.ai-panel-footer textarea:focus { outline: none; border-color: var(--accent); }
.ai-panel-footer .send-btn {
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.ai-panel-footer .send-btn:hover { background: var(--accent-dim); }
.ai-panel-footer .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.ai-typing { display: flex; gap: 4px; padding: 8px 16px; }
.ai-typing span {
  width: 6px; height: 6px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: ai-bounce 1.2s infinite;
}
.ai-typing span:nth-child(2) { animation-delay: .2s; }
.ai-typing span:nth-child(3) { animation-delay: .4s; }
@keyframes ai-bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}
.ai-remediate-btn {
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  border: 1px solid var(--accent);
}
.ai-remediate-btn:hover {
  background: linear-gradient(135deg, var(--accent-dim), #6d28d9);
}
.ai-offline-banner {
  background: var(--bg-hover);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── Ring-Based Rollout ─────────────────────────────────── */
.ring-progress {
  display: flex;
  align-items: center;
  gap: 0;
  margin: 12px 0;
  position: relative;
  width: 100%;
}
.ring-step {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  font-size: 11px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  position: relative;
  text-align: center;
  white-space: nowrap;
  transition: all 0.3s;
}
.ring-connector {
  width: 24px;
  height: 2px;
  background: var(--border);
  flex-shrink: 0;
  transition: background 0.3s;
}
.ring-step.pilot { background: var(--bg-hover); color: var(--text-muted); }
.ring-step.broad { background: var(--bg-hover); color: var(--text-muted); }
.ring-step.full  { background: var(--bg-hover); color: var(--text-muted); }
.ring-step.ring-active { background: var(--accent-glow); color: var(--accent); font-weight: 700; }
.ring-step.ring-complete { background: #102020; color: var(--installed); }
.ring-step.ring-blocked { background: var(--critical-bg); color: var(--critical); }
.ring-connector.ring-active { background: var(--accent); }

<script>
// ── Storage Keys ──────────────────────────────────────────────────
const KEYS = {
  CONTRACT_VERSION:       'security-tools:contract-version',
  ERROR_LOG:              'security-tools:error-log',
  THEME:                  'security-tools:remflow-theme',
  DEPLOYMENTS:            'security-tools:remflow-deployments',
  IMPORTED_FINDINGS:      'security-tools:imported-findings',
  LAST_IMPORT:            'security-tools:remflow-last-import',
  VALIDATED_REMEDIATIONS: 'security-tools:validated-remediations',
  REMEDIATION_QUEUE:      'security-tools:remediation-queue',
  VERIFIED_QUEUE:         'security-tools:verified-queue',
  LAUNCHPAD_QUEUE:        'security-tools:launchpad-queue',
  RING_CONFIG:            'security-tools:remflow-ring-config',
  RING_REMEDIATIONS:      'security-tools:remflow-ring-remediations',
  CHANGE_REQUESTS:         'security-tools:change-requests',
  MAINTENANCE_WINDOWS:     'security-tools:remflow-mw-config',
  BLACKOUT_DATES:          'security-tools:remflow-blackout-dates'
};

// ════ Key Migration (v1 → v2) ════════════════════════════════════
(function migrateKeysV2() {
  const MIGRATIONS = [
    { old: 'remflow-theme',             newKey: KEYS.THEME },
    { old: 'remflow-ring-config',       newKey: KEYS.RING_CONFIG },
    { old: 'remflow-ring-remediations', newKey: KEYS.RING_REMEDIATIONS },
    { old: 'remflow-maintenance-windows', newKey: KEYS.MAINTENANCE_WINDOWS },
    { old: 'remflow-blackout-dates',    newKey: KEYS.BLACKOUT_DATES },
  ];
  try {
    MIGRATIONS.forEach(function(m) {
      var oldData = localStorage.getItem(m.old);
      if (oldData !== null) {
        // Only migrate if the new key doesn't already have data
        if (localStorage.getItem(m.newKey) === null) {
          localStorage.setItem(m.newKey, oldData);
        }
        // Leave original key intact for v1 compatibility during rollout
      }
    });
  } catch(e) { /* silent — migration is best-effort at load time */ }
})();

// ════ Async Storage Adapter (dynamic import + vendored fallback) ──
(function initStorageAdapter() {
  window.__remflowStorageAdapter = null;
  var vendoredAdapter = {
    getItem: function(key) { return localStorage.getItem(key); },
    setItem: function(key, value) { localStorage.setItem(key, value); },
    removeItem: function(key) { localStorage.removeItem(key); },
    clear: function() { localStorage.clear(); }
  };
  // Try dynamic import from launchpad; fall back to vendored localStorage
  try {
    import('/launchpad/shared/storage-adapter.js')
      .then(function(mod) {
        window.__remflowStorageAdapter = mod.default || mod;
        console.log('[RemFlow] ✅ Launchpad storage adapter loaded');
      })
      .catch(function() {
        window.__remflowStorageAdapter = vendoredAdapter;
        console.log('[RemFlow] ⚠️ Using vendored localStorage fallback');
      });
  } catch(e) {
    window.__remflowStorageAdapter = vendoredAdapter;
  }
  // Synchronous fallback is always immediately available
  if (!window.__remflowStorageAdapter) {
    window.__remflowStorageAdapter = vendoredAdapter;
  }
})();

// ════ Contract Version Check ─────────────────────────────────(function(){  var CV = KEYS.CONTRACT_VERSION;  var VER = '2.0.0';  try {    var stored = localStorage.getItem(CV);    if (!stored) { localStorage.setItem(CV, VER); return; }    if (stored !== VER) {      var b = document.createElement('div');      b.style.cssText = 'background:#352215;color:#ff7722;padding:8px 16px;text-align:center;font-size:12px;font-family:monospace;cursor:pointer;z-index:99999;position:relative';      b.textContent = '⚠ Contract v' + VER + ' ≠ stored v' + stored + '. Some features may not work. Click to dismiss.';      b.onclick = function(){ b.remove(); localStorage.setItem(CV, VER); };      document.body.insertBefore(b, document.body.firstChild);    }  } catch(e) {}})();
// ════ Error Catcher ──────────────────────────────────────────
(function(){'use strict';const SK=KEYS.ERROR_LOG,MX=200,TN=document.title||location.pathname.split('/').filter(Boolean).pop()||'Unknown';function gl(){try{return JSON.parse(localStorage.getItem(SK)||'[]')}catch(e){return[]}}function sl(l){try{while(l.length>MX)l.shift();localStorage.setItem(SK,JSON.stringify(l))}catch(e){try{while(l.length>50)l.shift();localStorage.setItem(SK,JSON.stringify(l))}catch(e2){}}}function ae(e){e.tool=TN;e.url=location.href;e.timestamp=new Date().toISOString();e.userAgent=navigator.userAgent;const l=gl();l.push(e);sl(l)}
window.onerror=function(m,s,l,c,err){ae({type:'runtime-error',message:String(m),source:s||'',line:l||0,col:c||0,stack:err&&err.stack?String(err.stack).slice(0,2000):''});return false};
window.addEventListener('unhandledrejection',function(e){const r=e.reason;ae({type:'unhandled-rejection',message:String(r),stack:r&&r.stack?String(r.stack).slice(0,2000):''})});
var oce=console.error;console.error=function(){try{var a=Array.prototype.slice.call(arguments);ae({type:'console-error',message:a.map(function(x){try{return typeof x==='object'?JSON.stringify(x,null,2).slice(0,500):String(x)}catch(e){return String(x)}}).join(' ').slice(0,2000),args:a.length})}catch(e){}return oce.apply(console,arguments)};
window.__debugLog=function(m,d){ae({type:'manual',message:String(m),data:d?JSON.stringify(d).slice(0,1000):''})};
console.log('['+TN+'] Error catcher active ✓');})();

// ── API Configuration ──────────────────────────────────────────
const API_MODE = "demo"; // "demo" (fake data) | "api" (live backend)
const API_BASE = "http://localhost:8000/v1"; // Change to deployed URL

let apiCache = {};
async function apiFetch(endpoint, opts = {}) {
  const key = endpoint + JSON.stringify(opts);
  if (apiCache[key]) return apiCache[key];
  try {
    const res = await fetch(API_BASE + endpoint, {
      headers: { 'Content-Type': 'application/json', ...opts.headers },
      ...opts,
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    if (!opts.noCache) apiCache[key] = data;
    return data;
  } catch(e) {
    console.warn('API fetch failed, falling back to demo data:', e.message);
    return null;
  }
}

const THEMES = ['dark','light']; let currentTheme = localStorage.getItem(KEYS.THEME)||'dark';

const SEVS=['Critical','High','Medium','Low'];

const LOCS=['US-East (nyc1)','US-West (sfo1)','EU-Central (fra1)','APAC-Singapore','US-East (iad1)','EU-West (lhr1)'];

const DEPLOY_STS=['All','Installed','Pending','Failed'];
const HOSTS=['WEB-PROD-03','DC-PROD-01','DC-PROD-02','EXCH-PROD-01','EXCH-PROD-02','APP-PROD-07','APP-PROD-12','DB-PROD-02','DB-PROD-05','DNS-PROD-01','FW-PROD-01','NPS-PROD-01','K8S-PROD-03','K8S-PROD-07','CI-CD-01','CI-CD-02','MAC-ENG-14','MAC-ENG-22','MAC-EXEC-01','MAC-EXEC-05','SRV-DEV-07','SRV-DEV-12','SRV-STAG-03','CORP-WS7421','CORP-LT3512','CORP-LT3902','NYC-WS441','SFO-LT228','LON-WS115','FRA-VM033'];
const CVE_IDS=['CVE-2026-12345','CVE-2026-11223','CVE-2026-09876','CVE-2026-04567','CVE-2026-33445','CVE-2026-42002','CVE-2026-44004','CVE-2026-25501','CVE-2026-29100','CVE-2026-38801','CVE-2026-17204','CVE-2026-22984','CVE-2026-36712','CVE-2026-40123','CVE-2026-18990','CVE-2026-30221','CVE-2026-21101','CVE-2026-52003'];
const CVE_NAMES={'CVE-2026-12345':'Log Library Remote Code Execution','CVE-2026-11223':'Print Service Elevation of Privilege','CVE-2026-09876':'TLS Certificate Parsing Vulnerability','CVE-2026-04567':'OS Kernel Privilege Escalation','CVE-2026-33445':'Mail Server Remote Code Execution','CVE-2026-42002':'Browser Engine Remote Code Execution','CVE-2026-44004':'MDM API Authorization Bypass','CVE-2026-25501':'Hypervisor Server Remote Code Execution','CVE-2026-29100':'Network OS Web UI Auth Bypass','CVE-2026-38801':'Firewall OS Command Injection','CVE-2026-17204':'Graphics Driver Elevation of Privilege','CVE-2026-22984':'Database Agent Remote Code Execution','CVE-2026-36712':'Container Runtime Privilege Escalation','CVE-2026-40123':'Collaboration Platform Remote Code Execution','CVE-2026-18990':'SSH Server Remote Code Execution','CVE-2026-30221':'Video Conference Client EoP','CVE-2026-21101':'ITSM Platform Remote Code Execution','CVE-2026-52003':'Container Engine Privilege Escalation'};

const IP_MAP={};

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function randInt(mn,mx){return Math.floor(Math.random()*(mx-mn))+mn}
function ago(h){const d=new Date(Date.now()-h*3600000);return d.toISOString().slice(0,16).replace('T',' ')}
function sevClass(s){return s.toLowerCase()}

const assets = [];
for(let i=0;i<HOSTS.length;i++){
  const h=HOSTS[i]; const os=pick(OSES); const loc=pick(LOCS);
  IP_MAP[h]='10.23.'+randInt(0,255)+'.'+randInt(1,254);
  const findings=[];
  const nf=randInt(2,7);
  for(let f=0;f<nf;f++){
    const cve=pick(CVE_IDS);
    findings.push({
      cve, name:CVE_NAMES[cve], severity:pick(SEVS),
      kb:KBS[cve]||'n/a', status:pick(STS),
      firstSeen:ago(randInt(48,720)), lastUpdated:ago(randInt(0,48)),
      fixAvailable:Math.random()>0.15
    });
  }
  assets.push({hostname:h,os,loc,ip:IP_MAP[h],findings,lastScan:ago(randInt(0,6))});
}

const remediations = [];
for(let r=0;r<24;r++){
  const cve=pick(CVE_IDS); const tgt=[]; const nc=randInt(3,12);
  for(let t=0;t<nc;t++)tgt.push(pick(HOSTS));
  const uni=[...new Set(tgt)];
  const status=pick(REM_STS);

// ── CSV Parser (vanilla JS, handles quoted fields) ──────────────
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (i + 1 < text.length && text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field.trim()); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (field || row.length > 0) {
          row.push(field.trim());
          if (row.some(f => f !== '')) rows.push(row);
          row = [];
          field = '';
        }
        if (c === '\r' && i + 1 < text.length && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if (field || row.length > 0) {
    row.push(field.trim());
    if (row.some(f => f !== '')) rows.push(row);
  }
  return rows;
}

// Build deployment lookup: hostname -> {package, status, timestamp, exitCode}
function buildDeploymentLookup() {
  const records = getDeploymentRecords();
  const lookup = {};
  records.forEach(r => {
    const host = r.Hostname || r.Computer || r.hostname || '';
    if (!host) return;
    if (!lookup[host]) lookup[host] = [];
    lookup[host].push({
      package: r.Package || r.package || '',
      status: (r.Status || r.status || 'Unknown').toLowerCase(),
      timestamp: r.Timestamp || r['Deploy Time'] || r.timestamp || '',
      exitCode: r['Exit Code'] || r.exitCode || ''
    });
  });
  return lookup;
}

function getShieldViewFindings() {

function getShieldViewCVEs() {
  const findings = getShieldViewFindings();
  const cveMap = {};
  findings.forEach(f => {
    const cve = f.cve || f.CVE || '';
    const name = f.name || f.Name || f.title || f.Title || '';
    const severity = f.severity || f.Severity || 'Medium';
    const assets = f.assets || f.affectedAssets || f.hosts || [];
    if (!cve) return;
    if (!cveMap[cve]) {
      cveMap[cve] = { cve, name, severity, assetCount: 0, assets: [] };
    }
    // assets could be a number or an array
    if (Array.isArray(assets)) {
      assets.forEach(a => { if (!cveMap[cve].assets.includes(a)) cveMap[cve].assets.push(a); });
      cveMap[cve].assetCount = cveMap[cve].assets.length;
    } else if (typeof assets === 'number') {
      cveMap[cve].assetCount = Math.max(cveMap[cve].assetCount, assets);
    } else {
      cveMap[cve].assetCount = Math.max(cveMap[cve].assetCount, 1);
    }
  });
  return Object.values(cveMap);
}

function uniqueNonEmpty(values) {
  return [...new Set((values || []).map(v => String(v || '').trim()).filter(Boolean))];
}

function canonicalAssets(rem) {
  return uniqueNonEmpty([...(rem?.assets || []), ...(rem?.targets || []), ...(rem?.affectedAssets || [])]);
}

function buildCanonicalQueueItem(rem, source) {
  const assets = canonicalAssets(rem);
  const now = new Date().toISOString();
  return {
    id: rem?.id || ('RF-' + (rem?.cve || 'UNKNOWN') + '-' + Date.now()),
    cve: rem?.cve || '',
    name: rem?.name || rem?.title || CVE_NAMES[rem?.cve] || rem?.cve || 'Remediation',
    kb: rem?.kb || KBS[rem?.cve] || 'n/a',
    assets: assets,
    targets: assets,
    targetCount: assets.length,
    status: 'pending',
    source: source || 'RemFlow',
    queuedAt: now,
    createdAt: rem?.createdAt || now,
    coverage: rem?.coverage || 0,
    severity: rem?.severity || 'Medium',
    rollbackCommand: rem?.rollbackCommand || null,
    rollbackUnavailableReason: rem?.rollbackUnavailableReason || null,
    sourceFindingIds: rem?.sourceFindingIds || [],
    findings: rem?.findings || []
  };
}

function isCanonicalRemediation(item) {
  return !!(item && typeof item.cve === 'string' && item.cve &&
    typeof item.name === 'string' && item.name &&
    Array.isArray(item.assets) &&
    ['pending','queued','deployed','verified','failed','blocked','rolledBack'].includes(item.status));
}

function normalizeQueueStatus(status) {
  const s = String(status || 'pending').trim();
  const lower = s.toLowerCase();
  if (lower === 'completed' || lower === 'validated') return 'deployed';
  if (lower === 'rolled back' || lower === 'rolledback') return 'rolledBack';
  if (['pending','queued','deployed','verified','failed','blocked','rolledBack'].includes(s)) return s;
  if (['pending','queued','deployed','verified','failed','blocked'].includes(lower)) return lower;
  return 'pending';
}

function normalizeQueueRemediation(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const assetsList = uniqueNonEmpty([...(raw.assets || []), ...(raw.targets || []), ...(raw.affectedAssets || []), raw.asset, raw.hostname]);
  const status = normalizeQueueStatus(raw.status);
  const now = new Date().toISOString();
  const item = {
    ...raw,
    id: raw.id || raw.remediationKey || ('RQ-' + (raw.cve || 'UNKNOWN') + '-' + Math.abs(JSON.stringify(raw).split('').reduce((a, c) => ((a << 5) - a + c.charCodeAt(0)) | 0, 0))),
    cve: raw.cve || '',
    name: raw.name || raw.title || CVE_NAMES[raw.cve] || raw.cve || 'Remediation',
    kb: raw.kb || KBS[raw.cve] || 'n/a',
    assets: assetsList,
    targets: assetsList,
    targetCount: assetsList.length,
    status,
    created: raw.created || raw.createdAt || raw.timestamp || raw.queuedAt || now,
    completed: raw.completed || raw.completedAt || raw.deployedAt || '-',
    coverage: raw.coverage || raw.deployedCount || 0,
    fromQueue: true,
    fromShieldView: raw.fromShieldView || raw.from === 'ShieldView' || raw.source === 'ShieldView'
  };
  return isCanonicalRemediation(item) ? item : null;
}

function readRemediationQueue() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.map(normalizeQueueRemediation).filter(Boolean);
  } catch(e) {
    return [];
  }
}

function remediationMergeKey(rem) {
  return rem.remediationKey || rem.id || [rem.source || rem.from || '', rem.cve || '', (rem.sourceFindingIdentityKeys || []).join('|'), (rem.assets || rem.targets || []).join('|')].join('::');
}

function addUniqueRemediation(list, remediation) {
  const key = remediationMergeKey(remediation);
  if (!list.find(r => remediationMergeKey(r) === key)) list.push(remediation);
}

// Calculate deployment status for a remediation based on its targets
function getRemediationDeployStats(remediation, depLookup) {
  const stats = { installed: 0, pending: 0, failed: 0 };
  if (!remediation.targets) return stats;
  remediation.targets.forEach(host => {
    const records = depLookup[host];
    if (!records || records.length === 0) {
      // No deployment data — treat as pending for demo if remediation has coverage
      if (remediation.status === 'Completed') stats.installed++;
      else if (remediation.status === 'In Progress') stats.pending++;
      else if (remediation.status === 'Failed') stats.failed++;
      else stats.pending++;
      return;
    }
    records.forEach(rec => {
      const s = rec.status;
      if (s === 'installed' || s === 'success' || s === 'completed') stats.installed++;
      else if (s === 'pending' || s === 'in progress' || s === 'queued') stats.pending++;
      else stats.failed++;
    });
  });
  return stats;
}

        html += renderRollbackUnavailable(rbReason, 'rb-' + r.id + '-' + kb.replace(/[^a-zA-Z0-9]/g, ''));
      } else {
        html += renderRollbackCommands(rbBlocks, 'rb-' + r.id + '-' + kb.replace(/[^a-zA-Z0-9]/g, ''));
      }
    });
    html += `</div>`;
  }

  document.getElementById('page-remediation-detail').innerHTML=html;
  navigateTo('remediation-detail');
}

function openAIForRemediation(remId) {
  const allRems = window.__allRems || remediations;
  const r = allRems.find(x => x.id === remId);
  if (!r) return;

  const sampleOS = r.targets && r.targets.length > 0
    ? (assets.find(a => a.hostname === r.targets[0]) || {}).os || 'Windows Server 2022'
    : 'Windows Server 2022';

  const context = {
    cve: r.cve,
    name: r.name || CVE_NAMES[r.cve] || r.cve,
    severity: r.status === 'Completed' ? 'Low' : (r.status === 'Failed' ? 'Critical' : 'Medium'),
    os: sampleOS,
    solution: 'Apply ' + (r.kb || 'vendor patch') + ' for ' + r.cve,
    kb: r.kb || 'n/a',
    extra: 'Affected assets: ' + (r.targets ? r.targets.slice(0, 5).join(', ') + (r.targets.length > 5 ? ' +' + (r.targets.length - 5) + ' more' : '') : 'unknown') + '. Current coverage: ' + r.coverage + '%. Status: ' + r.status + '.'
  };

  openAIPanel(context);
}

// ── Data Source drop zone helpers ──────────────────────────────
function setupDropZone(dropZoneId, fileInputId) {
  const dz = document.getElementById(dropZoneId);
  if (!dz) return;
  dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => { dz.classList.remove('drag-over'); });
  dz.addEventListener('drop', (e) => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) {
      const input = document.getElementById(fileInputId);
      if (fileInputId === 'sccm-file-input') handleSCCMFile(file);
      else handlePDQFile(file);
    }
  });
}

function handleSCCMFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const rows = parseCSV(text);
    if (rows.length === 0) { showToast('⚠️ Empty CSV file'); return; }
    // First row is header
    const header = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
    const hostnameIdx = header.findIndex(h => h.includes('hostname') || h === 'hostname' || h === 'computer');
    const packageIdx = header.findIndex(h => h.includes('package') || h === 'package');
    const versionIdx = header.findIndex(h => h.includes('version') || h === 'version');
    const statusIdx = header.findIndex(h => h.includes('status') || h === 'status');
    const timestampIdx = header.findIndex(h => h.includes('timestamp') || h.includes('time') || h === 'timestamp');

    if (hostnameIdx === -1 || statusIdx === -1) {
      showToast('⚠️ CSV must have Hostname and Status columns');
      renderImportSummary('sccm', null, 0, 0, 'Missing required columns');
      return;
    }

    const records = [];
    let successCount = 0, failedCount = 0;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (row.length < Math.max(hostnameIdx, statusIdx) + 1) continue;
      const status = (row[statusIdx] || '').trim().toLowerCase();
      if (status === 'installed' || status === 'success') successCount++;
      else if (status === 'failed' || status === 'error') failedCount++;

      records.push({
        Hostname: (row[hostnameIdx] || '').trim(),
        Package: packageIdx >= 0 ? (row[packageIdx] || '').trim() : '',
        Version: versionIdx >= 0 ? (row[versionIdx] || '').trim() : '',
        Status: (row[statusIdx] || '').trim(),
        Timestamp: timestampIdx >= 0 ? (row[timestampIdx] || '').trim() : '',
        source: 'SCCM',
        importedAt: new Date().toISOString()
      });
    }

    // Merge with existing records (replace duplicates by hostname+package)
    const existing = getDeploymentRecords();
    const merged = mergeDeploymentRecords(existing, records);
    saveDeploymentRecords(merged);

    renderImportSummary('sccm', file.name, records.length, successCount, failedCount);
    renderImportedRecordsTable();
    showToast(`✅ Imported ${records.length} SCCM records (${successCount} installed, ${failedCount} failed)`);
  };
  reader.readAsText(file);
}

function handlePDQFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const rows = parseCSV(text);
    if (rows.length === 0) { showToast('⚠️ Empty CSV file'); return; }
    const header = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
    const computerIdx = header.findIndex(h => h.includes('computer') || h.includes('hostname') || h === 'computer');
    const packageIdx = header.findIndex(h => h.includes('package') || h === 'package');
    const statusIdx = header.findIndex(h => h.includes('status') || h === 'status');
    const exitCodeIdx = header.findIndex(h => h.includes('exitcode') || h.includes('exit') || h === 'exitcode');
    const deployTimeIdx = header.findIndex(h => h.includes('deploytime') || h.includes('deploy') || h.includes('time') || h === 'deploytime');

    if (computerIdx === -1 || statusIdx === -1) {
      showToast('⚠️ CSV must have Computer and Status columns');
      renderImportSummary('pdq', null, 0, 0, 'Missing required columns');
      return;
    }

    const records = [];
    let successCount = 0, failedCount = 0;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (row.length < Math.max(computerIdx, statusIdx) + 1) continue;
      const status = (row[statusIdx] || '').trim().toLowerCase();
      if (status === 'installed' || status === 'success') successCount++;
      else if (status === 'failed' || status === 'error') failedCount++;

      records.push({
        Computer: (row[computerIdx] || '').trim(),
        Hostname: (row[computerIdx] || '').trim(),
        Package: packageIdx >= 0 ? (row[packageIdx] || '').trim() : '',
        Status: (row[statusIdx] || '').trim(),
        'Exit Code': exitCodeIdx >= 0 ? (row[exitCodeIdx] || '').trim() : '',
        'Deploy Time': deployTimeIdx >= 0 ? (row[deployTimeIdx] || '').trim() : '',
        Timestamp: deployTimeIdx >= 0 ? (row[deployTimeIdx] || '').trim() : '',
        source: 'PDQ',
        importedAt: new Date().toISOString()
      });
    }

    const existing = getDeploymentRecords();
    const merged = mergeDeploymentRecords(existing, records);
    saveDeploymentRecords(merged);

    renderImportSummary('pdq', file.name, records.length, successCount, failedCount);
    renderImportedRecordsTable();
    showToast(`✅ Imported ${records.length} PDQ records (${successCount} installed, ${failedCount} failed)`);
  };
  reader.readAsText(file);
}

function mergeDeploymentRecords(existing, incoming) {
  const merged = [...existing];
  incoming.forEach(inc => {
    const host = inc.Hostname || inc.Computer || '';
    const pkg = inc.Package || '';
    // Replace matching record or append
    const idx = merged.findIndex(e =>
      (e.Hostname || e.Computer || '') === host &&
      (e.Package || '') === pkg
    );
    if (idx >= 0) merged[idx] = inc;
    else merged.push(inc);
  });
  return merged;
}

function pushToTheValidator(cveId) {
  try {
    const queue = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]');
    // Check if already queued
    const existing = queue.find(i => i.cve === cveId && i.status === 'pending');
    if (existing) {
      showToast(`⚠️ ${cveId} is already queued in TheValidator`);
      return;
    }
    const rem = (window.__allRems || remediations).find(r => r.cve === cveId);
    const item = buildCanonicalQueueItem(rem || { cve: cveId, name: CVE_NAMES[cveId] || cveId, kb: KBS[cveId] || 'n/a' }, 'RemFlow');
    if (!isCanonicalRemediation(item)) throw new Error('canonical remediation validation failed');
    queue.push(item);
    localStorage.setItem(KEYS.REMEDIATION_QUEUE, JSON.stringify(queue));
    showToast(`📤 ${cveId} pushed to TheValidator validation queue`);
  } catch(e) {
    showToast('⚠️ Failed to push: ' + e.message);
  }
}
function pushAllToTheValidator() {
  const allRems = window.__allRems || remediations;
  let count = 0;
  allRems.forEach(r => {
    try {
      const queue = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]');
      if (!queue.find(i => i.cve === r.cve && i.status === 'pending')) {
        const item = buildCanonicalQueueItem(r, 'RemFlow');
        if (!isCanonicalRemediation(item)) return;
        queue.push(item);
        localStorage.setItem(KEYS.REMEDIATION_QUEUE, JSON.stringify(queue));
        count++;
      }
    } catch(e) {}
  });
  showToast(`📤 Pushed ${count} remediations to TheValidator`);
}

function statusBadge(s){
  const map={
    'Completed':'badge-success','Success':'badge-success','Fixed':'badge-success',
    'In Progress':'badge-warning','Pending':'badge-warning','Queued':'badge-warning',
    pending:'badge-warning',queued:'badge-warning',deployed:'badge-success',verified:'badge-success',blocked:'badge-critical',rolledBack:'badge-info',
    'Failed':'badge-critical','Rolled Back':'badge-medium',
    'Active':'badge-critical','Mitigated':'badge-info',
    'False Positive':'badge-medium','Risk Accepted':'badge-medium',
    'Timeout':'badge-critical'
  };
  return `<span class="badge ${map[s]||'badge-info'}">${s}</span>`;
}

function deployStatusBadge(s) {
  if (!s) return `<span class="badge badge-info">—</span>`;
  const ls = s.toLowerCase();
  if (ls === 'installed' || ls === 'success' || ls === 'completed')
    return `<span class="badge badge-installed">${s}</span>`;
  if (ls === 'pending' || ls === 'queued' || ls === 'in progress')
    return `<span class="badge badge-pending">${s}</span>`;
  if (ls === 'failed' || ls === 'error' || ls === 'timeout')
    return `<span class="badge badge-failed">${s}</span>`;
  return `<span class="badge badge-info">${s}</span>`;
}

// ════ Ring-Based Rollout System ════════════════════════════════
// Default ring configuration — stored in localStorage
function getRingConfig() {
  try {
    const stored = localStorage.getItem(KEYS.RING_CONFIG);
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  // Default: tag-based mapping + hostname pattern fallback
  return {
    tagMap: { 'dev': 'pilot', 'staging': 'broad', 'test': 'broad', 'prod': 'full' },
    hostPatterns: { 'pilot': '*-DEV-*', 'broad': '*-STG-*|*-TEST-*', 'full': '*-PROD-*' },
    successThreshold: 95,
    minAssetsPerRing: 5,
    defaultRing: 'pilot'
  };
}

function saveRingConfig(cfg) {
  localStorage.setItem(KEYS.RING_CONFIG, JSON.stringify(cfg));
}

// Get ring assignments for remediations from localStorage
function getRingAssignments() {
  try { return JSON.parse(localStorage.getItem(KEYS.RING_REMEDIATIONS) || '{}'); }
  catch(e) { return {}; }
}

function saveRingAssignments(assignments) {
  localStorage.setItem(KEYS.RING_REMEDIATIONS, JSON.stringify(assignments));
}

// Determine ring for a hostname
function ringFromHostname(hostname, cfg) {
  if (!cfg) cfg = getRingConfig();
  const h = (hostname || '').toUpperCase();
  // Check hostname patterns
  const patterns = cfg.hostPatterns || {};
  const patternKeys = Object.keys(patterns);
  for (let i = 0; i < patternKeys.length; i++) {
    const ring = patternKeys[i];
    const pat = patterns[ring];
    if (!pat) continue;
    const parts = pat.split('|');
    for (let j = 0; j < parts.length; j++) {
      const re = new RegExp('^' + parts[j].replace(/\*/g, '.*') + '$', 'i');
      if (re.test(h)) return ring;
    }
  }
  // Fallback: check env tag in hostname
  const tagMap = cfg.tagMap || {};
  const tagKeys = Object.keys(tagMap);
  for (let k = 0; k < tagKeys.length; k++) {
    if (h.indexOf(tagKeys[k].toUpperCase()) >= 0) return tagMap[tagKeys[k]];
  }
  return cfg.defaultRing || 'pilot';
}

// Determine overall ring for a remediation based on its targets
function getRemediationRing(remId, targets, cfg) {
  const assignments = getRingAssignments();
  if (assignments[remId] && assignments[remId].ring) return assignments[remId];
  if (!cfg) cfg = getRingConfig();
  // All remediations start in pilot
  return { ring: 'pilot', blocked: false, autoPromote: false };
}

// Get remediation ring info (ensures stored or computed)
function getRingInfo(remId, targets) {
  const assignments = getRingAssignments();
  if (assignments[remId]) return assignments[remId];
  const info = { ring: 'pilot', blocked: false, autoPromote: false };
  assignments[remId] = info;
  saveRingAssignments(assignments);
  return info;
}

// Check if a remediation can be promoted to the next ring
function canPromoteRing(remId, targets) {
  const ringInfo = getRingInfo(remId, targets);
  if (ringInfo.blocked) return { can: false, reason: 'Blocked — failure rate too high' };
  const currentRing = ringInfo.ring;
  const rings = ['pilot', 'broad', 'full'];
  const ringIdx = rings.indexOf(currentRing);
  if (ringIdx >= rings.length - 1) return { can: false, reason: 'Already at full deployment' };
  if (ringIdx < 0) return { can: false, reason: 'Unknown ring' };

  const cfg = getRingConfig();
  const threshold = cfg.successThreshold || 95;
  const minAssets = cfg.minAssetsPerRing || 5;

  // Check minimum assets in current ring
  if (targets && targets.length < minAssets) {
    return { can: false, reason: 'Need at least ' + minAssets + ' assets in current ring (currently ' + targets.length + ')' };
  }

  // Check TheValidator verified count
  let queue = [];
  try { queue = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]'); } catch(e) {}
  let validated = [];
  try { validated = JSON.parse(localStorage.getItem(KEYS.VALIDATED_REMEDIATIONS) || '[]'); } catch(e) {}

  // Get deployment lookup for this rem
  const depLookup = buildDeploymentLookup();
  const rem = (window.__allRems || remediations).find(function(r) { return r.id === remId; });
  const stats = rem ? getRemediationDeployStats(rem, depLookup) : { installed: 0, pending: 0, failed: 0 };
  const deployed = stats.installed;
  let verified = 0;
  // Count validated items from TheValidator that match CVE of this rem
  if (rem) {
    validated.forEach(function(v) {
      if (v.cve === rem.cve) verified++;
    });
  }
  queue.forEach(function(q) {
    if (rem && q.cve === rem.cve && (q.status === 'deployed' || q.status === 'validated')) verified++;
  });

  const totalAssessed = deployed > 0 ? deployed : (targets ? targets.length : 1);
  const successRate = totalAssessed > 0 ? Math.round((verified / totalAssessed) * 100) : 0;
  if (deployed > 0 && verified < deployed * (threshold / 100)) {
    return { can: false, reason: 'Success rate ' + successRate + '% below threshold ' + threshold + '%', stats: { deployed, verified, successRate, threshold } };
  }

  return {
    can: true,
    reason: 'Ready for ' + rings[ringIdx + 1],
    nextRing: rings[ringIdx + 1],
    stats: { deployed, verified, successRate, threshold }
  };
}

// Promote a remediation to the next ring
function promoteRing(remId) {
  const check = canPromoteRing(remId);
  if (!check.can) {
    showToast('⚠️ Cannot promote: ' + check.reason);
    return false;
  }
  const assignments = getRingAssignments();
  const info = assignments[remId] || { ring: 'pilot', blocked: false, autoPromote: false };
  info.ring = check.nextRing;
  info.promotedAt = new Date().toISOString();
  assignments[remId] = info;
  saveRingAssignments(assignments);

  // Update in-memory remediation
  const allRems = window.__allRems || remediations;
  const rem = allRems.find(function(r) { return r.id === remId; });
  if (rem) rem.ring = info.ring;

  showToast('✅ Promoted ' + remId + ' to ' + check.nextRing.toUpperCase() + ' ring');
  return true;
}

// Block a remediation
function blockRemediation(remId, reason) {
  const assignments = getRingAssignments();
  const info = assignments[remId] || { ring: 'pilot', blocked: false, autoPromote: false };
  info.blocked = true;
  info.blockedReason = reason || 'Failure rate exceeded threshold';
  info.blockedAt = new Date().toISOString();
  assignments[remId] = info;
  saveRingAssignments(assignments);

  const allRems = window.__allRems || remediations;
  const rem = allRems.find(function(r) { return r.id === remId; });
  if (rem) rem.blocked = true;

  showToast('🛑 ' + remId + ' BLOCKED: ' + (reason || 'Failure rate exceeded threshold'));
}

// Unblock a remediation
function unblockRemediation(remId) {
  const assignments = getRingAssignments();
  const info = assignments[remId];
  if (!info) return;
  info.blocked = false;
  info.blockedReason = null;
  assignments[remId] = info;
  saveRingAssignments(assignments);

  const allRems = window.__allRems || remediations;
  const rem = allRems.find(function(r) { return r.id === remId; });
  if (rem) { rem.blocked = false; rem.blockedReason = null; }
  showToast('✅ ' + remId + ' unblocked');
}

// Toggle auto-promote
function toggleAutoPromote(remId, enabled) {
  const assignments = getRingAssignments();
  const info = assignments[remId] || { ring: 'pilot', blocked: false, autoPromote: false };
  info.autoPromote = enabled;
  assignments[remId] = info;
  saveRingAssignments(assignments);
}

// Get ring statistics for dashboard
function getRingStats() {
  const allRems = window.__allRems || remediations;
  const assignments = getRingAssignments();
  const stats = { pilot: 0, broad: 0, full: 0, blocked: 0, total: allRems.length };
  allRems.forEach(function(r) {
    const info = assignments[r.id] || { ring: 'pilot', blocked: false };
    if (info.blocked) stats.blocked++;
    else stats[info.ring] = (stats[info.ring] || 0) + 1;
  });
  return stats;
}

// Render ring progress bar
function renderRingProgressBar(remId, ringInfo) {
  if (!ringInfo) ringInfo = getRingInfo(remId);
  const rings = ['pilot', 'broad', 'full'];
  const currentRing = ringInfo.ring || 'pilot';
  const isBlocked = ringInfo.blocked;
  let ringIdx = rings.indexOf(currentRing);
  if (ringIdx < 0) ringIdx = 0;

  let html = '<div class="ring-progress">';
  for (let i = 0; i < rings.length; i++) {
    const ring = rings[i];
    let cls = ring;
    let label = ring.toUpperCase();
    if (isBlocked && i >= ringIdx) {
      cls += ' ring-blocked';
      label = i === ringIdx ? 'BLOCKED' : ring.toUpperCase();
    } else if (i < ringIdx) {
      cls += ' ring-complete';
      label = '✓';
    } else if (i === ringIdx && !isBlocked) {
      cls += ' ring-active';
    }
    html += '<div class="ring-step ' + cls + '">' + label + '</div>';
    if (i < rings.length - 1) {
      let connCls = 'ring-connector';
      if (isBlocked && i >= ringIdx) connCls += ' ring-blocked';
      else if (i < ringIdx) connCls += ' ring-complete';
      else if (i === ringIdx && !isBlocked) connCls += ' ring-active';
      html += '<div class="' + connCls + '"></div>';
    }
  }
  html += '</div>';
  return html;
}

function renderRingBadge(ring, blocked) {
  if (blocked) return '<span class="ring-badge ring-blocked">BLOCKED</span>';
  const r = ring || 'pilot';
  return '<span class="ring-badge ring-' + r + '">' + r.toUpperCase() + '</span>';
}

// Auto-check and promote remediations
function autoCheckPromotions() {
  const allRems = window.__allRems || remediations;
  const assignments = getRingAssignments();
  let promoted = 0, blocked = 0;
  const cfg = getRingConfig();
  allRems.forEach(function(r) {
    const info = assignments[r.id] || { ring: 'pilot', blocked: false, autoPromote: false };
    if (info.blocked || info.ring === 'full') return;
    const check = canPromoteRing(r.id, r.targets);
    if (info.autoPromote && check.can) {
      if (promoteRing(r.id)) promoted++;
    } else if (check.stats && check.stats.deployed > 0 && check.stats.successRate < (cfg.successThreshold || 95)) {
      if (!info.blocked) {
        blockRemediation(r.id, 'Success rate ' + check.stats.successRate + '% below threshold ' + (cfg.successThreshold || 95) + '%');
        blocked++;
      }
    }
  });
}

// ── KB Detection & PowerShell Command Generation ─────────────
function detectKB(text) {
  if (!text) return [];
  const patterns = [
    /\bKB\s*(\d{6,8})\b/gi,
    /\bkb\s*(\d{6,8})\b/g,
    /KB(\d{6,8})\b/gi,
    /kb(\d{6,8})\b/g,
    /SEC-(\d{4}-\d{3,4})\b/gi,
  ];
  const found = new Set();
  for (const pat of patterns) {
    let m;
    while ((m = pat.exec(text)) !== null) {
      const kb = 'KB' + m[1];
      found.add(kb.toUpperCase());
    }
  }
  return [...found].slice(0, 5);
}

function detectOS(osName) {
  if (!osName) return 'windows';
  const n = osName.toLowerCase();
  if (n.includes('server')) return 'windows-server';
  if (n.includes('windows')) return 'windows';
  if (n.includes('mac') || n.includes('os x')) return 'macos';
  if (n.includes('rhel') || n.includes('ubuntu') || n.includes('linux')) return 'linux';
  return 'windows';
}

function generatePSCommands(kbId, context) {
  const os = detectOS(context.os || '');
  const kb = kbId.toUpperCase().replace(/^KB/i, 'KB');

  const blocks = [];

  if (os === 'windows' || os === 'windows-server') {
    // Check if installed
    blocks.push({
      label: 'Check Installation Status',
      platform: 'PowerShell (Windows)',
      code: `# Verify if ${kb} is already installed
Get-HotFix -Id ${kb} -ErrorAction SilentlyContinue

# Alternative: search all installed updates
Get-HotFix | Where-Object HotFixID -like "*${kb.replace('KB','')}*"

# Or via WMI/CIM
Get-CimInstance -ClassName Win32_QuickFixEngineering | Where-Object HotFixID -eq "${kb}"`
    });

    // Download
    blocks.push({
      label: 'Download from Microsoft Update Catalog',
      platform: 'PowerShell (Windows)',
      code: `# Download ${kb} from Microsoft Update Catalog
$kbUrl = "https://catalog.s.download.windowsupdate.com/c/msdownload/update/software/secu/${kb}.msu"
$outPath = "$env:TEMP\\${kb}.msu"

# Download with progress
Invoke-WebRequest -Uri $kbUrl -OutFile $outPath -UseBasicParsing

# Verify download
if (Test-Path $outPath) {
    Write-Host "Downloaded: $((Get-Item $outPath).Length / 1MB) MB" -ForegroundColor Green
} else {
    Write-Host "Download failed - check catalog URL" -ForegroundColor Red
}`
    });

    // Install
    blocks.push({
      label: 'Install Update',
      platform: 'PowerShell (Windows)',
      code: `# Install ${kb} silently
$msuPath = "$env:TEMP\\${kb}.msu"

# Option A: wusa.exe (built-in)
Start-Process -FilePath "wusa.exe" -ArgumentList ('"' + $msuPath + '" /quiet /norestart') -Wait -NoNewWindow

# Option B: DISM (for offline/servicing)
# dism /online /add-package /packagepath:"$env:TEMP\\${kb}.msu"

# Option C: PSWindowsUpdate module (if installed)
if (Get-Module -ListAvailable -Name PSWindowsUpdate) {
    Import-Module PSWindowsUpdate
    Install-WindowsUpdate -KBArticleID "${kb}" -AcceptAll -AutoReboot
} else {
    Write-Host "Install PSWindowsUpdate: Install-Module PSWindowsUpdate" -ForegroundColor Yellow
}

# Verify installation
Get-HotFix -Id ${kb} -ErrorAction SilentlyContinue
if ($?) { Write-Host "${kb} installed successfully" -ForegroundColor Green }`
    });

    // Rollback
    blocks.push({
      label: 'Rollback / Uninstall',
      platform: 'PowerShell (Windows)',
      code: `# Uninstall ${kb} if needed
wusa.exe /uninstall /kb:${kb.replace('KB','')} /quiet /norestart

# Check pending reboot
if (Get-ItemProperty "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager" -Name PendingFileRenameOperations -ErrorAction SilentlyContinue) {
    Write-Host "⚠️ Pending reboot required" -ForegroundColor Yellow
}`
    });

    if (context.version) {
      blocks.push({
        label: `Verify Application Version (${context.version})`,
        platform: 'PowerShell (Windows)',
        code: `# Check installed application version
Get-ItemProperty "HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*" |
    Where-Object DisplayName -like "*${context.app || 'Application'}*" |
    Select-Object DisplayName, DisplayVersion, Publisher, InstallDate

# Also check 32-bit registry on 64-bit systems
Get-ItemProperty "HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*" |
    Where-Object DisplayName -like "*${context.app || 'Application'}*" |
    Select-Object DisplayName, DisplayVersion`
      });
    }
  } else if (os === 'linux') {
    blocks.push({
      label: 'Check & Apply Patch (Linux)',
      platform: 'Bash (Linux)',
      code: `# Check current kernel/packages
uname -r
rpm -qa --last | head -20   # RHEL/CentOS
dpkg -l | grep -i security   # Debian/Ubuntu

# Apply updates
sudo yum update --security   # RHEL/CentOS
sudo apt update && sudo apt upgrade -y  # Ubuntu/Debian

# Verify after reboot
echo "Reboot and verify: $(uname -r)"`
    });
  } else if (os === 'macos') {
    blocks.push({
      label: 'Check & Apply Update (macOS)',
      platform: 'Terminal (macOS)',
      code: `# List available updates
softwareupdate -l

# Install all updates
sudo softwareupdate -i -a

# Install specific update
sudo softwareupdate -i "${kb}"

# Verify after reboot
sw_vers`
    });
  }

  return blocks;
}

// ── Rollback Command Generation ────────────────────────────
function generateRollback(kbId, context) {
  const os = detectOS(context.os || '');
  const kb = kbId.toUpperCase().replace(/^KB/i, 'KB');
  const kbNum = kb.replace('KB', '');

  const blocks = [];

  if (os === 'windows' || os === 'windows-server') {
    // KB uninstall
    blocks.push({
      label: `🗑️ Uninstall ${kb}`,
      platform: 'PowerShell (Windows)',
      code: `# Rollback: Uninstall ${kb}\nwusa /uninstall /kb:${kbNum} /quiet /norestart\n\n# Verify uninstall\nStart-Sleep -Seconds 10\n$installed = Get-HotFix -Id ${kb} -ErrorAction SilentlyContinue\nif ($installed) {\n    Write-Host "⚠️ ${kb} still installed — manual removal may be needed" -ForegroundColor Yellow\n} else {\n    Write-Host "✅ ${kb} successfully removed" -ForegroundColor Green\n}\n\n# Check pending reboot\nif (Get-ItemProperty "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager" -Name PendingFileRenameOperations -ErrorAction SilentlyContinue) {\n    Write-Host "⚠️ Pending reboot required to complete rollback" -ForegroundColor Yellow\n}\n\n# If uninstall fails, try DISM\n# dism /online /remove-package /packagename:"Package_for_${kb}~..."`
    });

    // Registry backup restore (for config changes)
    blocks.push({
      label: '🔄 Restore Registry Backup',
      platform: 'PowerShell (Windows)',
      code: `# Restore registry backup created before remediation\n$backupPath = "$env:TEMP\\remflow_registry_backup_${kbNum}.reg"\n\nif (Test-Path $backupPath) {\n    Write-Host "Restoring registry backup from: $backupPath" -ForegroundColor Cyan\n    reg import "$backupPath"\n    if ($LASTEXITCODE -eq 0) {\n        Write-Host "✅ Registry restored successfully" -ForegroundColor Green\n    } else {\n        Write-Host "❌ Registry restore failed — check backup file integrity" -ForegroundColor Red\n    }\n} else {\n    Write-Host "⚠️ No registry backup found at $backupPath" -ForegroundColor Yellow\n    Write-Host "Manual rollback may be required — check documentation for ${kb}" -ForegroundColor Yellow\n}`
    });

    // Service state reversal
    blocks.push({
      label: '⚙️ Reverse Service State Changes',
      platform: 'PowerShell (Windows)',
      code: `# If remediation changed service state, reverse it\n# Check common services affected by security patches\n$services = @('wuauserv', 'bits', 'cryptsvc', 'TrustedInstaller')\n\nforeach ($svc in $services) {\n    $s = Get-Service -Name $svc -ErrorAction SilentlyContinue\n    if ($s) {\n        Write-Host "$($s.Name): $($s.Status) - StartType: $($s.StartType)\"\n    }\n}\n\n# To re-enable a stopped service:\n# Set-Service -Name "servicename" -StartupType Automatic\n# Start-Service -Name "servicename"\n\n# To re-disable a started service:\n# Stop-Service -Name "servicename" -Force\n# Set-Service -Name "servicename" -StartupType Disabled`
    });

  } else if (os === 'linux') {
    blocks.push({
      label: '🔄 Rollback Package Update (Linux)',
      platform: 'Bash (Linux)',
      code: `# Rollback package to previous version\n# For RHEL/CentOS — downgrade:\n# sudo yum downgrade <package-name>-<old-version>\n\n# For Ubuntu/Debian — pin and downgrade:\n# apt list -a <package-name>\n# sudo apt install <package-name>=<old-version>\n# sudo apt-mark hold <package-name>\n\n# List recent yum transactions for rollback:\n# sudo yum history list\n# sudo yum history undo <transaction-id>\n\n# For full system rollback:\n# sudo yum history undo last`
    });
  } else if (os === 'macos') {
    blocks.push({
      label: '🔄 Rollback Software Update (macOS)',
      platform: 'Terminal (macOS)',
      code: `# macOS doesn't support direct uninstall of system updates.\n# Rollback options:\n# 1. Restore from Time Machine backup\n# 2. Reinstall macOS via Recovery (preserves user data)\n# 3. For App Store apps: delete and reinstall older version\n\n# Check installed update history:\n# softwareupdate --history\n\n# ⚠️ System security updates cannot be individually uninstalled.\n# Consider snapshot-based rollback or full system restore.`
    });
  }

  return blocks;
}

// Determine if rollback is unavailable and return reason
function getRollbackUnavailableReason(kbId, context) {
  const os = detectOS(context.os || '');
  const kb = kbId.toUpperCase().replace(/^KB/i, 'KB');

  if (os === 'macos') {
    return 'macOS system updates cannot be individually uninstalled. Use Time Machine or Recovery restore.';
  }
  if (os === 'linux' && (!kbId || kbId === 'N/A' || kbId.toLowerCase() === 'n/a')) {
    return 'No specific package identifier found — cannot generate targeted rollback.';
  }
  // For Windows: rollback is generally available via wusa
  if ((os === 'windows' || os === 'windows-server') && (!kbId || kbId.toUpperCase().replace('KB','').length < 5)) {
    return 'KB identifier is missing or invalid — cannot generate exact rollback command.';
  }
  return null; // null means rollback IS available
}

function renderPSCommands(blocks, blockId) {
  if (!blocks || blocks.length === 0) return '';
  const uid = blockId || ('ps-' + Math.random().toString(36).slice(2,8));
  return blocks.map((b, i) => `
<div class="ps-code-block" id="${uid}-${i}">
  <div class="ps-header" onclick="togglePSCodeBlock('${uid}-${i}')">

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Rollback Command Rendering ────────────────────────────
function renderRollbackCommands(blocks, blockId) {

function renderRollbackUnavailable(reason, blockId) {

      <span class="ru-icon">⚠️</span>

    </div>
  </div>`;
