<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:11434;">
<title>RemFlow — Remediation Intelligence</title>
<style>
:root {
  --bg-root: #060b18; --bg-surface: #0c1225; --bg-elevated: #111830;
  --bg-hover: #182040; --bg-sidebar: #080e1c;
  --border: #1a2540; --border-light: #243055;
  --text-primary: #e8ecf4; --text-secondary: #8899bb; --text-muted: #556888;
  --accent: #0066ff; --accent-dim: #0052cc; --accent-glow: rgba(0,102,255,0.25);
  --critical: #ff4444; --critical-bg: #351520;
  --high: #ff7722; --high-bg: #352215;
  --medium: #e6b800; --medium-bg: #353015;
  --low: #22cc66; --low-bg: #123020;
  --installed: #22cc66; --installed-bg: #123020;
  --pending: #ff7722; --pending-bg: #352215;
  --failed: #ff4444; --failed-bg: #351520;
  --radius-sm: 6px; --radius: 8px; --radius-lg: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --sidebar-w: 240px; --topbar-h: 56px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "Fira Code", Consolas, monospace;
}
[data-theme="light"] {
  --bg-root: #f0f2f8; --bg-surface: #fff; --bg-elevated: #f5f7fc;
  --bg-hover: #eef1f8; --bg-sidebar: #e8ecf4;
  --border: #d8dde8; --border-light: #e8ecf4;
  --text-primary: #0c1225; --text-secondary: #556888; --text-muted: #8899bb;
  --accent: #0052cc; --accent-dim: #003d99;
  --critical-bg: #fff0f0; --high-bg: #fff4ee; --medium-bg: #fffbe6; --low-bg: #eefff4;
  --installed-bg: #eefff4; --pending-bg: #fff4ee; --failed-bg: #fff0f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;color:var(--text-primary);background:var(--bg-root);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
th,td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:var(--bg-hover)}
.app{display:flex;height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;z-index:10;transition:width .2s}
.sidebar.collapsed{width:56px}
.sidebar-brand{padding:18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);height:var(--topbar-h);flex-shrink:0}
.sidebar-brand .logo{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 0 12px var(--accent-glow)}
.sidebar-brand .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .title,.sidebar.collapsed .section-label,.sidebar.collapsed .nav-item span:not(.icon),.sidebar.collapsed .user-info,.sidebar.collapsed .sidebar-footer .user-info{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px}
.sidebar-nav{padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:2px}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:12px 12px 6px;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary);text-decoration:none}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow)}
.nav-item .icon{width:20px;text-align:center;flex-shrink:0;font-size:15px}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar-footer .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.sidebar-footer .user-name{font-weight:600}
.sidebar-footer .user-role{color:var(--text-muted);font-size:11px}
.sidebar.collapsed .sidebar-footer{justify-content:center}
.sidebar.collapsed .sidebar-footer .user-info{display:none}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar-h);background:var(--bg-surface);border-bottom:1px solid var(--border);border-top:2px solid var(--accent);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.topbar .hamburger{background:none;border:none;color:var(--text-secondary);font-size:18px;padding:4px;border-radius:var(--radius-sm)}
.topbar .hamburger:hover{background:var(--bg-hover);color:var(--text-primary)}
.topbar .page-title{font-size:18px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.topbar-info{color:var(--text-muted);font-size:12px}
.theme-toggle,.tm-toggle{background:var(--bg-hover);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-secondary);padding:6px 10px;font-size:15px}
.theme-toggle:hover,.tm-toggle:hover{color:var(--text-primary);border-color:var(--border-light)}
.page{display:none;padding:24px;overflow-y:auto;flex:1}
.page.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:border-color .2s;cursor:pointer}
.stat-card:hover{border-color:var(--accent)}
.stat-card .stat-value{font-size:32px;font-weight:700;margin-bottom:4px}
.stat-card .stat-label{font-size:13px;color:var(--text-secondary)}
.stat-card .stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-secondary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.text-link{color:var(--accent);cursor:pointer}
.text-link:hover{text-decoration:underline}
.mono{font-family:var(--font-mono);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-critical{background:var(--critical-bg);color:var(--critical)}
.badge-high{background:var(--high-bg);color:var(--high)}
.badge-medium{background:var(--medium-bg);color:var(--medium)}
.badge-low{background:var(--low-bg);color:var(--low)}
.badge-success{background:#123020;color:#22cc66}
.badge-warning{background:#353015;color:#e6b800}
.badge-info{background:#102830;color:#00aacc}
.badge-pending{background:var(--pending-bg);color:var(--pending)}
.badge-installed{background:var(--installed-bg);color:var(--installed)}
.badge-failed{background:var(--failed-bg);color:var(--failed)}
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);font-size:13px;font-weight:500;transition:all .15s}
.btn:hover{border-color:var(--accent);background:var(--bg-hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dim)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--bg-hover);border-color:var(--border)}
.btn-group{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-input{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);padding:8px 12px;font-size:13px;width:280px;font-family:inherit}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-input::placeholder{color:var(--text-muted)}
.filter-select{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);padding:7px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.filter-group{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ml-auto{margin-left:auto}
.mt-12{margin-top:12px}
.mb-12{margin-bottom:12px}
.flex{display:flex;align-items:center;gap:8px}
.flex-wrap{flex-wrap:wrap}
.gap-8{gap:8px}
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0}
.chart-bar-item{flex:1;border-radius:var(--radius-sm) var(--radius-sm) 0 0;min-height:4px;position:relative;transition:height .3s}
.chart-bar-item .chart-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-muted);white-space:nowrap}
.progress-bar{height:8px;background:var(--bg-hover);border-radius:4px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.clickable{cursor:pointer}
.clickable:hover td{background:var(--bg-hover)!important}

/* ── Data Sources: Drop Zones ──────────────────────────── */
.drop-zone{
  border:2px dashed var(--border-light);
  border-radius:var(--radius-lg);
  padding:40px 20px;
  text-align:center;
  background:var(--bg-elevated);
  transition:all .2s;
  cursor:pointer;
  margin-bottom:16px;
}
.drop-zone:hover,.drop-zone.drag-over{
  border-color:var(--accent);
  background:var(--bg-hover);
  box-shadow:0 0 16px var(--accent-glow);
}
.drop-zone .dz-icon{font-size:36px;margin-bottom:8px;display:block}
.drop-zone .dz-title{font-weight:600;color:var(--text-primary);margin-bottom:4px}
.drop-zone .dz-sub{font-size:12px;color:var(--text-muted)}
.drop-zone .dz-hint{font-size:11px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)}
.import-summary{
  background:var(--bg-elevated);
  border:1px solid var(--accent);
  border-radius:var(--radius-lg);
  padding:16px 20px;
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.import-summary .is-stat{text-align:center;min-width:80px}
.import-summary .is-val{font-size:22px;font-weight:700}
.import-summary .is-lbl{font-size:11px;color:var(--text-muted)}

/* ── Deployment status colors ─────────────────────────── */
.deployment-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;width:100%;margin:2px 0}
.deployment-bar .db-installed{background:var(--installed)}
.deployment-bar .db-pending{background:var(--pending)}
.deployment-bar .db-failed{background:var(--failed)}
.deployment-tooltip{font-size:10px;color:var(--text-muted);white-space:nowrap}
.shieldview-banner{
  background:var(--accent-glow);
  border:1px solid var(--accent);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:12px;
}

/* ── KB / PowerShell Code Blocks ─────────────────────── */
.ps-code-block {
  background: #0a0f1c;
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 8px 0;
  position: relative;
}
.ps-code-block .ps-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg-hover);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.ps-code-block .ps-header .ps-label {
  font-weight: 600;
  color: var(--accent);
  font-family: var(--font-mono);
}
.ps-code-block .ps-header .copy-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  padding: 3px 8px;
  font-size: 10px;
  cursor: pointer;
  transition: all .15s;
}
.ps-code-block .ps-header .copy-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.ps-code-block .ps-header .copy-btn.copied {
  background: var(--low);
  border-color: var(--low);
  color: #fff;
}
.ps-code-block pre {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: #c0d0e0;
  white-space: pre;
  max-height: 400px;
  overflow-y: auto;
}
.ps-code-block pre .comment { color: #6a8a6a; }
.ps-code-block pre .keyword { color: #5599dd; }
.ps-code-block pre .string { color: #ce9a6e; }
.ps-code-block pre .cmdlet { color: #ddcc66; }
.ps-code-block pre .param { color: #88bbdd; }
.ps-code-block .ps-toggle {
  cursor: pointer;
  user-select: none;
}
.ps-code-block.collapsed pre { display: none; }
.kb-badge {
  display: inline-block;
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  transition: all .15s;
}
.kb-badge:hover {
  background: var(--accent);
  color: #fff;
}

/* ── AI Remediation Chat Panel ────────────────────────── */
.ai-panel-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 2000;
  display: none;
}
.ai-panel-overlay.open { display: block; }
.ai-panel {
  position: fixed;
  top: 0; right: -480px;
  width: 440px; max-width: 95vw;
  height: 100vh;
  background: var(--bg-elevated);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 2001;
  transition: right .3s ease;
  box-shadow: -4px 0 24px rgba(0,0,0,0.4);
}
.ai-panel.open { right: 0; }
.ai-panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  background: var(--bg-surface);
}
.ai-panel-header .ai-title {
  font-weight: 700;
  font-size: 15px;
  flex: 1;
}
.ai-panel-header .close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
}
.ai-panel-header .close-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.ai-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ai-chat-bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  line-height: 1.55;
  max-width: 90%;
  word-wrap: break-word;
}
.ai-chat-bubble.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.ai-chat-bubble.assistant {
  align-self: flex-start;
  background: var(--bg-hover);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-bottom-left-radius: 4px;
}
.ai-chat-bubble.assistant pre {
  background: #0a0f1c;
  padding: 10px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  overflow-x: auto;
  margin: 8px 0;
  white-space: pre-wrap;
}
.ai-chat-bubble.assistant strong { color: var(--accent); }
.ai-chat-bubble.system-msg {
  align-self: center;
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  text-align: center;
  max-width: 100%;
  padding: 4px 12px;
}
.ai-panel-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  background: var(--bg-surface);
}
.ai-panel-footer textarea {
  flex: 1;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  padding: 8px 10px;
  font-size: 12px;
  font-family: inherit;
  resize: none;
  min-height: 40px;
  max-height: 100px;
}
.ai-panel-footer textarea:focus { outline: none; border-color: var(--accent); }
.ai-panel-footer .send-btn {
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.ai-panel-footer .send-btn:hover { background: var(--accent-dim); }
.ai-panel-footer .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.ai-typing { display: flex; gap: 4px; padding: 8px 16px; }
.ai-typing span {
  width: 6px; height: 6px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: ai-bounce 1.2s infinite;
}
.ai-typing span:nth-child(2) { animation-delay: .2s; }
.ai-typing span:nth-child(3) { animation-delay: .4s; }
@keyframes ai-bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}
.ai-remediate-btn {
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  border: 1px solid var(--accent);
}
.ai-remediate-btn:hover {
  background: linear-gradient(135deg, var(--accent-dim), #6d28d9);
}
.ai-offline-banner {
  background: var(--bg-hover);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

@media(max-width:768px){
  .sidebar{position:fixed;left:-240px;transition:left .2s;height:100vh;z-index:100}
  .sidebar.open{left:0}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
  .sidebar-overlay.show{display:block}
  .stats-grid{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .search-input{width:100%}
  .deployment-bar{width:60px}
}
</style>
</head>
<body>
<div class="app">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
<div class="sidebar-brand">
<div class="logo">⚡</div><span class="title">RemFlow</span>
</div>
<div class="sidebar-nav">
<div class="section-label">Operations</div>
<button class="nav-item active" onclick="navigateTo('dashboard')" data-page="dashboard"><span class="icon">📊</span><span>Dashboard</span></button>
<button class="nav-item" onclick="navigateTo('findings')" data-page="findings"><span class="icon">🔍</span><span>Findings</span></button>
<button class="nav-item" onclick="navigateTo('remediations')" data-page="remediations"><span class="icon">🛠️</span><span>Remediations</span></button>
<button class="nav-item" onclick="navigateTo('deployments')" data-page="deployments"><span class="icon">📦</span><span>Deployments</span></button>
<div class="section-label" style="margin-top:12px">Infrastructure</div>
<button class="nav-item" onclick="navigateTo('assets')" data-page="assets"><span class="icon">🖥️</span><span>Assets</span></button>
<button class="nav-item" onclick="navigateTo('datasources')" data-page="datasources"><span class="icon">📥</span><span>Data Sources</span></button>
<button class="nav-item" onclick="navigateTo('pipeline')" data-page="pipeline"><span class="icon">🔄</span><span>Pipeline</span></button>
</div>
<div class="sidebar-footer">
<div class="avatar">DC</div>
<div class="user-info"><div class="user-name">David Chiang</div><div class="user-role" style="margin-bottom:3px">Remediation Analyst</div><div style="font-size:10px"><a href="debug.html" target="_blank" style="color:var(--accent);text-decoration:none;opacity:0.7">🔍 Debug Console</a></div></div>
</div>
</div>
<div class="main">
<div class="topbar">
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="page-title" id="pageTitle">Dashboard</div>
<div class="topbar-right">
<span class="topbar-info" id="syncTime"></span>
<button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
</div>
</div>

let apiCache = {};
async function apiFetch(endpoint, opts = {}) {
  const key = endpoint + JSON.stringify(opts);
  if (apiCache[key]) return apiCache[key];
  try {
    const res = await fetch(API_BASE + endpoint, {
      headers: { 'Content-Type': 'application/json', ...opts.headers },
      ...opts,
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    if (!opts.noCache) apiCache[key] = data;
    return data;
  } catch(e) {
    console.warn('API fetch failed, falling back to demo data:', e.message);
    return null;
  }
}

// ── CSV Parser (vanilla JS, handles quoted fields) ──────────────
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (i + 1 < text.length && text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field.trim()); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (field || row.length > 0) {
          row.push(field.trim());
          if (row.some(f => f !== '')) rows.push(row);
          row = [];
          field = '';
        }
        if (c === '\r' && i + 1 < text.length && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if (field || row.length > 0) {
    row.push(field.trim());
    if (row.some(f => f !== '')) rows.push(row);
  }
  return rows;
}

// ── Deployment Data from CSV Imports ───────────────────────────
function getDeploymentRecords() {
  try {
    return JSON.parse(localStorage.getItem(KEYS.DEPLOYMENTS) || '[]');
  } catch(e) { return []; }
}

function saveDeploymentRecords(records) {
  localStorage.setItem(KEYS.DEPLOYMENTS, JSON.stringify(records));
}

// Build deployment lookup: hostname -> {package, status, timestamp, exitCode}
function buildDeploymentLookup() {
  const records = getDeploymentRecords();
  const lookup = {};
  records.forEach(r => {
    const host = r.Hostname || r.Computer || r.hostname || '';
    if (!host) return;
    if (!lookup[host]) lookup[host] = [];
    lookup[host].push({
      package: r.Package || r.package || '',
      status: (r.Status || r.status || 'Unknown').toLowerCase(),
      timestamp: r.Timestamp || r['Deploy Time'] || r.timestamp || '',
      exitCode: r['Exit Code'] || r.exitCode || ''
    });
  });
  return lookup;
}

// ── ShieldView Integration ─────────────────────────────────────
function getShieldViewFindings() {
  try {
    return JSON.parse(localStorage.getItem(KEYS.IMPORTED_FINDINGS) || '[]');
  } catch(e) { return []; }
}

function getShieldViewCVEs() {
  const findings = getShieldViewFindings();
  const cveMap = {};
  findings.forEach(f => {
    const cve = f.cve || f.CVE || '';
    const name = f.name || f.Name || f.title || f.Title || '';
    const severity = f.severity || f.Severity || 'Medium';
    const assets = f.assets || f.affectedAssets || f.hosts || [];
    if (!cve) return;
    if (!cveMap[cve]) {
      cveMap[cve] = { cve, name, severity, assetCount: 0, assets: [] };
    }
    // assets could be a number or an array
    if (Array.isArray(assets)) {
      assets.forEach(a => { if (!cveMap[cve].assets.includes(a)) cveMap[cve].assets.push(a); });
      cveMap[cve].assetCount = cveMap[cve].assets.length;
    } else if (typeof assets === 'number') {
      cveMap[cve].assetCount = Math.max(cveMap[cve].assetCount, assets);
    } else {
      cveMap[cve].assetCount = Math.max(cveMap[cve].assetCount, 1);
    }
  });
  return Object.values(cveMap);
}

// Auto-create remediation items from ShieldView data
function autoCreateShieldViewRemediations() {
  const cves = getShieldViewCVEs();
  if (cves.length === 0) return [];
  const autoRems = [];
  cves.forEach(c => {
    // Check if remediation already exists for this CVE
    const exists = remediations.find(r => r.cve === c.cve);
    if (exists) return;
    const created = ago(randInt(0, 4));
    autoRems.push({
      id: 'RM-SV-' + (1000 + autoRems.length),
      cve: c.cve,
      name: c.name || CVE_NAMES[c.cve] || c.cve,
      kb: KBS[c.cve] || 'SV-' + c.cve.replace('CVE-', ''),
      targets: c.assets.length > 0 ? c.assets : HOSTS.slice(0, Math.min(c.assetCount || 3, HOSTS.length)),
      targetCount: c.assetCount || c.assets.length || Math.min(3, HOSTS.length),
      status: 'Queued',
      created,
      completed: '-',
      coverage: 0,
      fromShieldView: true
    });
  });
  return autoRems;
}

// ── Dashboard ──────────────────────────────────────────────────
async function renderDashboard(){
  let allF, assetsList, deploymentsList, remediationsList;

  if (API_MODE === "api") {
    const dash = await apiFetch('/remflow/dashboard');
    if (dash) {
      document.getElementById('page-dashboard').innerHTML = renderDashboardHTML(dash);
      return;
    }
    allF = []; assetsList = assets; deploymentsList = deployments; remediationsList = remediations;
  } else {
    allF=assets.flatMap(a=>a.findings);
    assetsList = assets; deploymentsList = deployments; remediationsList = remediations;
  }
  const total=allF.length;
  const autoRem=allF.filter(f=>f.status==='Fixed').length;
  const pending=allF.filter(f=>f.status==='Active').length;
  const failed=allF.filter(f=>f.status==='False Positive'||f.status==='Risk Accepted').length;
  const svCounts={Critical:0,High:0,Medium:0,Low:0};
  allF.forEach(f=>svCounts[f.severity]++);
  const cveCounts={};
  allF.forEach(f=>{cveCounts[f.cve]=(cveCounts[f.cve]||0)+1});
  const topCVE=Object.entries(cveCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const recentDeploy=deploymentsList.slice(0,5);

  document.getElementById('page-dashboard').innerHTML = renderDashboardHTML({
    total_findings: total,
    auto_remediated: autoRem,
    auto_rate: Math.round(autoRem/total*100),
    pending_review: pending,
    failed_remediations: failed,
    by_severity: svCounts,
    assets_monitored: assetsList.length,
    recent_deployments: recentDeploy,
    top_cves: topCVE.map(([cve,cnt])=>({cve,affected:cnt})),
  });
}

function renderRemTable(){

  const ds=document.getElementById('rem-depstatus')?.value||'all';
  const all=window.__allRems||[];
  const depLookup = buildDeploymentLookup();

  let filtered=all.filter(r=>{
    if(st!=='all'&&r.status!==st)return false;
    if(!q||r.cve.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)){
      // Check deployment status filter
      if(ds!=='all') {
        const rStatuses = getRemediationDeployStats(r, depLookup);
        if (ds==='installed' && rStatuses.installed===0) return false;
        if (ds==='pending' && rStatuses.pending===0) return false;

    }

  });

  let rows=filtered.map(r=>{

    const deployCoverage = r.targetCount > 0 ? Math.round((stats.installed / r.targetCount) * 100) : 0;

    // Build deployment bar
    let depBar = '';
    if (totalDeploy > 0) {

    } else {

    // Deployment coverage %

  document.getElementById('rem-tbody').innerHTML=rows||'<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">No remediations match</td></tr>';

// Calculate deployment status for a remediation based on its targets
function getRemediationDeployStats(remediation, depLookup) {
  const stats = { installed: 0, pending: 0, failed: 0 };
  if (!remediation.targets) return stats;
  remediation.targets.forEach(host => {
    const records = depLookup[host];
    if (!records || records.length === 0) {
      // No deployment data — treat as pending for demo if remediation has coverage
      if (remediation.status === 'Completed') stats.installed++;
      else if (remediation.status === 'In Progress') stats.pending++;
      else if (remediation.status === 'Failed') stats.failed++;
      else stats.pending++;
      return;
    }
    records.forEach(rec => {
      const s = rec.status;
      if (s === 'installed' || s === 'success' || s === 'completed') stats.installed++;
      else if (s === 'pending' || s === 'in progress' || s === 'queued') stats.pending++;
      else stats.failed++;
    });
  });
  return stats;
}

    });
    html += `</div>`;
  }

  document.getElementById('page-remediation-detail').innerHTML=html;
  navigateTo('remediation-detail');
}

function openAIForRemediation(remId) {
  const allRems = window.__allRems || remediations;
  const r = allRems.find(x => x.id === remId);
  if (!r) return;

  const sampleOS = r.targets && r.targets.length > 0
    ? (assets.find(a => a.hostname === r.targets[0]) || {}).os || 'Windows Server 2022'
    : 'Windows Server 2022';

  const context = {
    cve: r.cve,
    name: r.name || CVE_NAMES[r.cve] || r.cve,
    severity: r.status === 'Completed' ? 'Low' : (r.status === 'Failed' ? 'Critical' : 'Medium'),
    os: sampleOS,
    solution: 'Apply ' + (r.kb || 'vendor patch') + ' for ' + r.cve,
    kb: r.kb || 'n/a',
    extra: 'Affected assets: ' + (r.targets ? r.targets.slice(0, 5).join(', ') + (r.targets.length > 5 ? ' +' + (r.targets.length - 5) + ' more' : '') : 'unknown') + '. Current coverage: ' + r.coverage + '%. Status: ' + r.status + '.'
  };

  openAIPanel(context);
}

// ── Data Source drop zone helpers ──────────────────────────────
function setupDropZone(dropZoneId, fileInputId) {
  const dz = document.getElementById(dropZoneId);
  if (!dz) return;
  dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => { dz.classList.remove('drag-over'); });
  dz.addEventListener('drop', (e) => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) {
      const input = document.getElementById(fileInputId);
      if (fileInputId === 'sccm-file-input') handleSCCMFile(file);
      else handlePDQFile(file);
    }
  });
}

function handleSCCMFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const rows = parseCSV(text);
    if (rows.length === 0) { showToast('⚠️ Empty CSV file'); return; }
    // First row is header
    const header = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
    const hostnameIdx = header.findIndex(h => h.includes('hostname') || h === 'hostname' || h === 'computer');
    const packageIdx = header.findIndex(h => h.includes('package') || h === 'package');
    const versionIdx = header.findIndex(h => h.includes('version') || h === 'version');
    const statusIdx = header.findIndex(h => h.includes('status') || h === 'status');
    const timestampIdx = header.findIndex(h => h.includes('timestamp') || h.includes('time') || h === 'timestamp');

    if (hostnameIdx === -1 || statusIdx === -1) {
      showToast('⚠️ CSV must have Hostname and Status columns');
      renderImportSummary('sccm', null, 0, 0, 'Missing required columns');
      return;
    }

    const records = [];
    let successCount = 0, failedCount = 0;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (row.length < Math.max(hostnameIdx, statusIdx) + 1) continue;
      const status = (row[statusIdx] || '').trim().toLowerCase();
      if (status === 'installed' || status === 'success') successCount++;
      else if (status === 'failed' || status === 'error') failedCount++;

      records.push({
        Hostname: (row[hostnameIdx] || '').trim(),
        Package: packageIdx >= 0 ? (row[packageIdx] || '').trim() : '',
        Version: versionIdx >= 0 ? (row[versionIdx] || '').trim() : '',
        Status: (row[statusIdx] || '').trim(),
        Timestamp: timestampIdx >= 0 ? (row[timestampIdx] || '').trim() : '',
        source: 'SCCM',
        importedAt: new Date().toISOString()
      });
    }

    // Merge with existing records (replace duplicates by hostname+package)
    const existing = getDeploymentRecords();
    const merged = mergeDeploymentRecords(existing, records);
    saveDeploymentRecords(merged);

    renderImportSummary('sccm', file.name, records.length, successCount, failedCount);
    renderImportedRecordsTable();
    showToast(`✅ Imported ${records.length} SCCM records (${successCount} installed, ${failedCount} failed)`);
  };
  reader.readAsText(file);
}

function handlePDQFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const rows = parseCSV(text);
    if (rows.length === 0) { showToast('⚠️ Empty CSV file'); return; }
    const header = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
    const computerIdx = header.findIndex(h => h.includes('computer') || h.includes('hostname') || h === 'computer');
    const packageIdx = header.findIndex(h => h.includes('package') || h === 'package');
    const statusIdx = header.findIndex(h => h.includes('status') || h === 'status');
    const exitCodeIdx = header.findIndex(h => h.includes('exitcode') || h.includes('exit') || h === 'exitcode');
    const deployTimeIdx = header.findIndex(h => h.includes('deploytime') || h.includes('deploy') || h.includes('time') || h === 'deploytime');

    if (computerIdx === -1 || statusIdx === -1) {
      showToast('⚠️ CSV must have Computer and Status columns');
      renderImportSummary('pdq', null, 0, 0, 'Missing required columns');
      return;
    }

    const records = [];
    let successCount = 0, failedCount = 0;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (row.length < Math.max(computerIdx, statusIdx) + 1) continue;
      const status = (row[statusIdx] || '').trim().toLowerCase();
      if (status === 'installed' || status === 'success') successCount++;
      else if (status === 'failed' || status === 'error') failedCount++;

      records.push({
        Computer: (row[computerIdx] || '').trim(),
        Hostname: (row[computerIdx] || '').trim(),
        Package: packageIdx >= 0 ? (row[packageIdx] || '').trim() : '',
        Status: (row[statusIdx] || '').trim(),
        'Exit Code': exitCodeIdx >= 0 ? (row[exitCodeIdx] || '').trim() : '',
        'Deploy Time': deployTimeIdx >= 0 ? (row[deployTimeIdx] || '').trim() : '',
        Timestamp: deployTimeIdx >= 0 ? (row[deployTimeIdx] || '').trim() : '',
        source: 'PDQ',
        importedAt: new Date().toISOString()
      });
    }

    const existing = getDeploymentRecords();
    const merged = mergeDeploymentRecords(existing, records);
    saveDeploymentRecords(merged);

    renderImportSummary('pdq', file.name, records.length, successCount, failedCount);
    renderImportedRecordsTable();
    showToast(`✅ Imported ${records.length} PDQ records (${successCount} installed, ${failedCount} failed)`);
  };
  reader.readAsText(file);
}

function mergeDeploymentRecords(existing, incoming) {
  const merged = [...existing];
  incoming.forEach(inc => {
    const host = inc.Hostname || inc.Computer || '';
    const pkg = inc.Package || '';
    // Replace matching record or append
    const idx = merged.findIndex(e =>
      (e.Hostname || e.Computer || '') === host &&
      (e.Package || '') === pkg
    );
    if (idx >= 0) merged[idx] = inc;
    else merged.push(inc);
  });
  return merged;
}

function renderImportSummary(source, filename, total, success, failed) {

function importFromShieldView() {
  const findings = getShieldViewFindings();
  if (findings.length === 0) {
    showToast('⚠️ No ShieldView data to import');
    return;
  }

  const newRems = autoCreateShieldViewRemediations();
  let importedCount = 0;
  newRems.forEach(sr => {
    if (!remediations.find(r => r.cve === sr.cve)) {
      remediations.push(sr);
      importedCount++;
    }
  });

  // Store timestamp
  localStorage.setItem(KEYS.LAST_IMPORT, new Date().toISOString());

  const result = document.getElementById('sv-import-result');
  result.innerHTML = `<div style="padding:12px;background:var(--installed-bg);border:1px solid var(--installed);border-radius:var(--radius);color:var(--installed);font-weight:600">
    ✅ Imported ${findings.length} findings — ${importedCount} remediation items created
  </div>`;

  // Update status text
  const statusText = document.getElementById('sv-status-text');
  if (statusText) {
    statusText.textContent = `✅ ${findings.length} findings imported — last import: just now`;
  }

  showToast(`✅ Imported ${findings.length} findings — ${importedCount} remediation items created`);
}

function pushToTheValidator(cveId) {
  try {
    const queue = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]');
    // Check if already queued
    const existing = queue.find(i => i.cve === cveId && i.status === 'pending');
    if (existing) {
      showToast(`⚠️ ${cveId} is already queued in TheValidator`);
      return;
    }
    const rem = remediations.find(r => r.cve === cveId);
    queue.push({
      cve: cveId,
      name: CVE_NAMES[cveId] || cveId,
      kb: KBS[cveId] || 'n/a',
      targets: rem ? rem.targets : [],
      targetCount: rem ? rem.targetCount : 0,
      status: 'pending',
      source: 'RemFlow',
      queuedAt: new Date().toISOString(),
      coverage: rem ? rem.coverage : 0
    });
    localStorage.setItem(KEYS.REMEDIATION_QUEUE, JSON.stringify(queue));
    showToast(`📤 ${cveId} pushed to TheValidator validation queue`);
  } catch(e) {
    showToast('⚠️ Failed to push: ' + e.message);
  }
}

function pushAllToTheValidator() {
  const allRems = window.__allRems || remediations;
  let count = 0;
  allRems.forEach(r => {
    try {
      const queue = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]');
      if (!queue.find(i => i.cve === r.cve && i.status === 'pending')) {
        queue.push({
          cve: r.cve,
          name: r.name || CVE_NAMES[r.cve] || r.cve,
          kb: r.kb || 'n/a',
          targets: r.targets || [],
          targetCount: r.targetCount || 0,
          status: 'pending',
          source: 'RemFlow',
          queuedAt: new Date().toISOString(),
          coverage: r.coverage || 0
        });
        localStorage.setItem(KEYS.REMEDIATION_QUEUE, JSON.stringify(queue));
        count++;
      }
    } catch(e) {}
  });
  showToast(`📤 Pushed ${count} remediations to TheValidator`);
}

function statusBadge(s){
  const map={
    'Completed':'badge-success','Success':'badge-success','Fixed':'badge-success',
    'In Progress':'badge-warning','Pending':'badge-warning','Queued':'badge-warning',
    'Failed':'badge-critical','Rolled Back':'badge-medium',
    'Active':'badge-critical','Mitigated':'badge-info',
    'False Positive':'badge-medium','Risk Accepted':'badge-medium',
    'Timeout':'badge-critical'
  };
  return `<span class="badge ${map[s]||'badge-info'}">${s}</span>`;
}

function deployStatusBadge(s) {
  if (!s) return `<span class="badge badge-info">—</span>`;
  const ls = s.toLowerCase();
  if (ls === 'installed' || ls === 'success' || ls === 'completed')
    return `<span class="badge badge-installed">${s}</span>`;
  if (ls === 'pending' || ls === 'queued' || ls === 'in progress')
    return `<span class="badge badge-pending">${s}</span>`;
  if (ls === 'failed' || ls === 'error' || ls === 'timeout')
    return `<span class="badge badge-failed">${s}</span>`;
  return `<span class="badge badge-info">${s}</span>`;
}

function checkCrossToolQueue() {

function markRemediationComplete(cveId) {
  try {
    const queue = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]');
    const updated = queue.map(i => i.cve === cveId ? {...i, status: 'deployed', completedAt: new Date().toISOString()} : i);
    localStorage.setItem(KEYS.REMEDIATION_QUEUE, JSON.stringify(updated));
    const validated = JSON.parse(localStorage.getItem(KEYS.VALIDATED_REMEDIATIONS) || '[]');
    const item = queue.find(i => i.cve === cveId);

      validated.push({...item, status: 'validated', validatedAt: new Date().toISOString()});
      localStorage.setItem(KEYS.VALIDATED_REMEDIATIONS, JSON.stringify(validated));
    }
  } catch(e) {}
}
// ── KB Detection & PowerShell Command Generation ─────────────
function detectKB(text) {
  if (!text) return [];
  const patterns = [
    /\bKB\s*(\d{6,8})\b/gi,
    /\bkb\s*(\d{6,8})\b/g,
    /KB(\d{6,8})\b/gi,
    /kb(\d{6,8})\b/g,
    /SEC-(\d{4}-\d{3,4})\b/gi,
  ];
  const found = new Set();
  for (const pat of patterns) {
    let m;
    while ((m = pat.exec(text)) !== null) {
      const kb = 'KB' + m[1];
      found.add(kb.toUpperCase());
    }
  }
  return [...found].slice(0, 5);
}

function detectOS(osName) {
  if (!osName) return 'windows';
  const n = osName.toLowerCase();
  if (n.includes('server')) return 'windows-server';
  if (n.includes('windows')) return 'windows';
  if (n.includes('mac') || n.includes('os x')) return 'macos';
  if (n.includes('rhel') || n.includes('ubuntu') || n.includes('linux')) return 'linux';
  return 'windows';
}

function generatePSCommands(kbId, context) {
  const os = detectOS(context.os || '');
  const kb = kbId.toUpperCase().replace(/^KB/i, 'KB');

  const blocks = [];

  if (os === 'windows' || os === 'windows-server') {
    // Check if installed
    blocks.push({
      label: 'Check Installation Status',
      platform: 'PowerShell (Windows)',
      code: `# Verify if ${kb} is already installed
Get-HotFix -Id ${kb} -ErrorAction SilentlyContinue

# Alternative: search all installed updates
Get-HotFix | Where-Object HotFixID -like "*${kb.replace('KB','')}*"

# Or via WMI/CIM
Get-CimInstance -ClassName Win32_QuickFixEngineering | Where-Object HotFixID -eq "${kb}"`
    });

    // Download
    blocks.push({
      label: 'Download from Microsoft Update Catalog',
      platform: 'PowerShell (Windows)',
      code: `# Download ${kb} from Microsoft Update Catalog
$kbUrl = "https://catalog.s.download.windowsupdate.com/c/msdownload/update/software/secu/${kb}.msu"
$outPath = "$env:TEMP\\${kb}.msu"

# Download with progress
Invoke-WebRequest -Uri $kbUrl -OutFile $outPath -UseBasicParsing

# Verify download
if (Test-Path $outPath) {
    Write-Host "Downloaded: $((Get-Item $outPath).Length / 1MB) MB" -ForegroundColor Green
} else {
    Write-Host "Download failed - check catalog URL" -ForegroundColor Red
}`
    });

    // Install
    blocks.push({
      label: 'Install Update',
      platform: 'PowerShell (Windows)',
      code: `# Install ${kb} silently
$msuPath = "$env:TEMP\\${kb}.msu"

# Option A: wusa.exe (built-in)
Start-Process -FilePath "wusa.exe" -ArgumentList "`"$msuPath`" /quiet /norestart" -Wait -NoNewWindow

# Option B: DISM (for offline/servicing)
# dism /online /add-package /packagepath:"$env:TEMP\\${kb}.msu"

# Option C: PSWindowsUpdate module (if installed)
if (Get-Module -ListAvailable -Name PSWindowsUpdate) {
    Import-Module PSWindowsUpdate
    Install-WindowsUpdate -KBArticleID "${kb}" -AcceptAll -AutoReboot
} else {
    Write-Host "Install PSWindowsUpdate: Install-Module PSWindowsUpdate" -ForegroundColor Yellow
}

# Verify installation
Get-HotFix -Id ${kb} -ErrorAction SilentlyContinue
if ($?) { Write-Host "${kb} installed successfully" -ForegroundColor Green }`
    });

    // Rollback
    blocks.push({
      label: 'Rollback / Uninstall',
      platform: 'PowerShell (Windows)',
      code: `# Uninstall ${kb} if needed
wusa.exe /uninstall /kb:${kb.replace('KB','')} /quiet /norestart

# Check pending reboot
if (Get-ItemProperty "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager" -Name PendingFileRenameOperations -ErrorAction SilentlyContinue) {
    Write-Host "⚠️ Pending reboot required" -ForegroundColor Yellow
}`
    });

    if (context.version) {
      blocks.push({
        label: `Verify Application Version (${context.version})`,
        platform: 'PowerShell (Windows)',
        code: `# Check installed application version
Get-ItemProperty "HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*" |
    Where-Object DisplayName -like "*${context.app || 'Application'}*" |
    Select-Object DisplayName, DisplayVersion, Publisher, InstallDate

# Also check 32-bit registry on 64-bit systems
Get-ItemProperty "HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*" |
    Where-Object DisplayName -like "*${context.app || 'Application'}*" |
    Select-Object DisplayName, DisplayVersion`
      });
    }
  } else if (os === 'linux') {
    blocks.push({
      label: 'Check & Apply Patch (Linux)',
      platform: 'Bash (Linux)',
      code: `# Check current kernel/packages
uname -r
rpm -qa --last | head -20   # RHEL/CentOS
dpkg -l | grep -i security   # Debian/Ubuntu

# Apply updates
sudo yum update --security   # RHEL/CentOS
sudo apt update && sudo apt upgrade -y  # Ubuntu/Debian

# Verify after reboot
echo "Reboot and verify: $(uname -r)"`
    });
  } else if (os === 'macos') {
    blocks.push({
      label: 'Check & Apply Update (macOS)',
      platform: 'Terminal (macOS)',
      code: `# List available updates
softwareupdate -l

# Install all updates
sudo softwareupdate -i -a

# Install specific update
sudo softwareupdate -i "${kb}"

# Verify after reboot
sw_vers`
    });
  }

  return blocks;
}

function renderPSCommands(blocks, blockId) {
  if (!blocks || blocks.length === 0) return '';
  const uid = blockId || ('ps-' + Math.random().toString(36).slice(2,8));
  return blocks.map((b, i) => `
<div class="ps-code-block" id="${uid}-${i}">
  <div class="ps-header" onclick="togglePSCodeBlock('${uid}-${i}')">
    <span class="ps-toggle">${'▾ '}<span class="ps-label">${escHtml(b.label)}</span> <span style="font-size:10px;color:var(--text-muted)">${escHtml(b.platform)}</span></span>
    <button class="copy-btn" onclick="event.stopPropagation();copyPSCode('${uid}-${i}')" title="Copy to clipboard">📋 Copy</button>
  </div>
  <pre id="${uid}-${i}-code">${escHtml(b.code)}</pre>
</div>`).join('');
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function togglePSCodeBlock(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('collapsed');
}

function copyPSCode(blockId) {
  const codeEl = document.getElementById(blockId + '-code');
  if (!codeEl) return;
  const text = codeEl.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('#' + blockId + ' .copy-btn');
    if (btn) {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
    }
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 Copied to clipboard');
  });
}

// ── AI Remediation Assistant (Ollama) ────────────────────────
let aiContext = null;
let aiIsStreaming = false;

function openAIPanel(context) {
  aiContext = context || null;
  document.getElementById('aiPanelOverlay').classList.add('open');
  document.getElementById('aiPanel').classList.add('open');

function sendAIMessage() {
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();

  input.value = '';

  const body = document.getElementById('aiPanelBody');

  userBubble.textContent = text;
  body.appendChild(userBubble);

  // Show typing indicator

  const systemPrompt = aiContext
    ? `You are a Windows systems engineer. Help remediate this vulnerability. Context: CVE: ${aiContext.cve}, Name: ${aiContext.name}, Severity: ${aiContext.severity}, OS: ${aiContext.os || 'Windows Server 2022'}. Solution: ${aiContext.solution || 'Apply vendor patch'}. ${aiContext.extra || ''}`
    : 'You are a Windows systems engineer. Help remediate vulnerabilities.';

  callOllama(systemPrompt, text).then(response => {
    removeAITyping(typing);
    const asstBubble = document.createElement('div');
    asstBubble.className = 'ai-chat-bubble assistant';
    asstBubble.innerHTML = formatAIResponse(response);
    body.appendChild(asstBubble);
    body.scrollTop = body.scrollHeight;
  }).catch(err => {

        <span>Make sure Ollama is running on <strong>localhost:11434</strong>. <br>Start it: <code>ollama serve</code></span>
      </div>`;
    body.appendChild(errBubble);
    body.scrollTop = body.scrollHeight;
  });
}

function sendAIPrompt(context) {
  if (!context) return;

  const body = document.getElementById('aiPanelBody');
  const userBubble = document.createElement('div');
  userBubble.className = 'ai-chat-bubble user';
  userBubble.textContent = 'Analyze this vulnerability and provide a step-by-step remediation plan.';
  body.appendChild(userBubble);
  body.scrollTop = body.scrollHeight;

  const typing = showAITyping();

  const systemPrompt = `You are a senior Windows systems engineer with 20 years experience in vulnerability remediation. You work in an enterprise environment with Windows Server, Windows 10/11, and Linux servers.

Analyze this vulnerability and provide:
1. **Root Cause Assessment** — What is the vulnerability and how does it work?
2. **Step-by-Step PowerShell Remediation** — Exact PowerShell commands to fix it
3. **Verification Steps** — How to confirm the fix was applied
4. **Rollback Plan** — How to undo the change if needed

Context:
- CVE: ${context.cve}
- Name/Description: ${context.name || 'Unknown'}
- Severity: ${context.severity || 'Medium'}
- Affected OS: ${context.os || 'Windows Server 2022'}
- Vendor Solution: ${context.solution || 'Apply vendor patch/update'}
- KB Reference: ${context.kb || 'None'}
${context.extra || ''}

Be specific with PowerShell cmdlets, registry paths, service names, and verification commands.`;

  const userPrompt = `Generate a complete remediation plan for ${context.cve}.`;

  callOllama(systemPrompt, userPrompt).then(response => {
    removeAITyping(typing);
    const asstBubble = document.createElement('div');

      </div>

function showAITyping() {
  const body = document.getElementById('aiPanelBody');
  const typing = document.createElement('div');
  typing.className = 'ai-typing';
  typing.id = 'ai-typing-indicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;
  return typing;
}

function removeAITyping(el) {
  if (el && el.parentNode) el.remove();
}

function formatAIResponse(text) {
  if (!text) return '<em style="color:var(--text-muted)">No response received.</em>';
  let html = escHtml(text);
  // Bold: **text**
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Code blocks: ``` ... ```
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escHtml(code.trim())}</code></pre>`;
  });
  // Inline code: `code`
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-hover);padding:1px 4px;border-radius:3px;font-family:var(--font-mono);font-size:11px">$1</code>');
  // Numbered lists
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<strong>$1.</strong> $2');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  return html;
}

async function callOllama(systemPrompt, userPrompt) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 60000);

  try {
    const resp = await fetch('http://localhost:11434/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'llama3.2',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        stream: false,
        options: { temperature: 0.3, num_predict: 2048 }
      }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    }

    const data = await resp.json();
    return data.message?.content || data.response || JSON.stringify(data);
  } catch (err) {
    clearTimeout(timeoutId);
    throw err;
  }
}

function generateOfflineGuidance(ctx) {
  if (!ctx) return '';
  const cve = ctx.cve || '';
  const sev = (ctx.severity || '').toLowerCase();
  const os = (ctx.os || '').toLowerCase();

  let guidance = '<ul style="margin-top:4px;padding-left:20px">';
  guidance += '<li>Review the vendor advisory for ' + escHtml(cve) + '</li>';
  guidance += '<li>Check your patch management system (SCCM/WSUS) for available updates</li>';

  if (os.includes('windows')) {
    guidance += '<li>Run: <code>Get-HotFix</code> to check currently installed updates</li>';
    guidance += '<li>Use <code>Get-WindowsUpdate</code> from PSWindowsUpdate module</li>';
  } else if (os.includes('linux')) {
    guidance += '<li>Run: <code>yum check-update</code> or <code>apt list --upgradable</code></li>';
  } else if (os.includes('mac')) {
    guidance += '<li>Run: <code>softwareupdate -l</code> to list available updates</li>';
  }

  if (sev === 'critical') {
    guidance += '<li><strong style="color:var(--critical)">⚠️ CRITICAL:</strong> Prioritize immediate patching, consider temporary mitigations</li>';
  }

  guidance += '<li>Document all changes and test in staging first</li>';
  guidance += '</ul>';
  return guidance;
}

// Init — check hash first for deep links
function handleHash(){
  const hash=location.hash.replace(/^#\/?/,'').split('/');
  const page=hash[0]||'dashboard';
  const param=hash.slice(1).join('/');
  if(page==='finding'&&param) setTimeout(()=>viewFinding(decodeURIComponent(param)),100);
  else if(page==='deployment'&&param) setTimeout(()=>viewDeployment(decodeURIComponent(param)),100);
  else if(page==='remediation'&&param) setTimeout(()=>viewRemediation(decodeURIComponent(param)),100);
  else if(page==='deploy-fix'&&param) setTimeout(()=>showDeployFix(decodeURIComponent(param)),100);
  else if(page==='create-remediation'&&param) setTimeout(()=>showCreateRemediation(decodeURIComponent(param)),100);
  else if(page==='asset'&&param) setTimeout(()=>viewAsset(decodeURIComponent(param)),100);
  else navigateTo(page);
}
// Update URL on nav so deep links work
let _settingHash=false;
const _origNav=navigateTo;
navigateTo=function(page,param){
  _origNav(page,param);
  if(_settingHash) return;
  _settingHash=true;
  const hashMap={'finding-detail':'finding','deployment-detail':'deployment','remediation-detail':'remediation','create-remediation':'create-remediation','deploy-fix':'deploy-fix','asset-detail':'asset','datasources':'datasources','pipeline':'pipeline'};
  const hashPage=hashMap[page]||page;
  try{
    if(param) history.replaceState(null,'','#/'+hashPage+'/'+encodeURIComponent(param));
    else if(page!=='dashboard') history.replaceState(null,'','#/'+hashPage);
    else history.replaceState(null,'','#');
  }catch(e){}
  setTimeout(()=>{_settingHash=false},100);
};
document.getElementById('syncTime').textContent='Last sync: '+ago(0);
handleHash();

// Debug error catcher
window.onerror = function(msg, file, line, col, err) {
  console.error('RemFlow error:', msg, file, line, col, err);
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--critical-bg);border:1px solid var(--critical);color:var(--text-primary);padding:12px 20px;border-radius:var(--radius);font-size:13px;z-index:999;box-shadow:var(--shadow);max-width:600px';
  toast.innerHTML = `<strong>⚠️ Error</strong><br><span style="font-size:11px">${msg || 'Unknown error'} (${file}:${line})</span>`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 8000);
  return false;
};
