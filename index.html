function togglePSCodeBlock(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('collapsed');
}

function copyPSCode(blockId) {
  const codeEl = document.getElementById(blockId + '-code');
  if (!codeEl) return;
  const text = codeEl.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('#' + blockId + ' .copy-btn');
    if (btn) {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
    }
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 Copied to clipboard');
  });
}

// ── AI Remediation Assistant (Ollama) ────────────────────────
let aiContext = null;
let aiIsStreaming = false;

function openAIPanel(context) {
  aiContext = context || null;
  document.getElementById('aiPanelOverlay').classList.add('open');
  document.getElementById('aiPanel').classList.add('open');
  document.getElementById('aiChatInput').focus();

  // Clear old messages if this is a new context
  if (context) {
    const body = document.getElementById('aiPanelBody');
    body.innerHTML = '';
    const ctxMsg = document.createElement('div');
    ctxMsg.className = 'ai-chat-bubble system-msg';
    ctxMsg.textContent = `Analyzing: ${context.cve} — ${context.name || ''}`;
    body.appendChild(ctxMsg);

    // Auto-send initial prompt
    setTimeout(() => sendAIPrompt(context), 400);
  }
}

function closeAIPanel(event) {
  if (event && event.target !== document.getElementById('aiPanelOverlay')) return;
  document.getElementById('aiPanelOverlay').classList.remove('open');
  document.getElementById('aiPanel').classList.remove('open');
}

function sendAIMessage() {
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();
  if (!text || aiIsStreaming) return;
  input.value = '';

  const body = document.getElementById('aiPanelBody');
  const userBubble = document.createElement('div');
  userBubble.className = 'ai-chat-bubble user';
  userBubble.textContent = text;
  body.appendChild(userBubble);
  body.scrollTop = body.scrollHeight;

  // Show typing indicator
  const typing = showAITyping();

  const { system: systemPrompt } = window.Prompts.REMEDIATION_CHAT(aiContext || {});

  callOllama(systemPrompt, text).then(response => {
    removeAITyping(typing);
    const asstBubble = document.createElement('div');
    asstBubble.className = 'ai-chat-bubble assistant';
    asstBubble.innerHTML = formatAIResponse(response);
    body.appendChild(asstBubble);
    body.scrollTop = body.scrollHeight;
  }).catch(err => {
    removeAITyping(typing);
    const errBubble = document.createElement('div');
    errBubble.className = 'ai-chat-bubble system-msg';
    errBubble.innerHTML = `<span style="color:var(--critical)">⚠️ Ollama unavailable: ${escHtml(err.message)}</span>
      <div class="ai-offline-banner" style="margin-top:8px">
        <span>🔌</span>
        <span>Make sure Ollama is running on <strong>localhost:11434</strong>. <br>Start it: <code>ollama serve</code></span>
      </div>`;
    body.appendChild(errBubble);
    body.scrollTop = body.scrollHeight;
  });
}

function sendAIPrompt(context) {
  if (!context) return;

  const body = document.getElementById('aiPanelBody');
  const userBubble = document.createElement('div');
  userBubble.className = 'ai-chat-bubble user';
  userBubble.textContent = 'Analyze this vulnerability and provide a step-by-step remediation plan.';
  body.appendChild(userBubble);
  body.scrollTop = body.scrollHeight;

  const typing = showAITyping();

  const { system: systemPrompt, user: userPrompt } = window.Prompts.REMEDIATION_PLAN(context);

  callOllama(systemPrompt, userPrompt).then(response => {
    removeAITyping(typing);
    const asstBubble = document.createElement('div');
    asstBubble.className = 'ai-chat-bubble assistant';
    asstBubble.innerHTML = formatAIResponse(response);
    body.appendChild(asstBubble);
    body.scrollTop = body.scrollHeight;
  }).catch(err => {
    removeAITyping(typing);
    const errBubble = document.createElement('div');
    errBubble.className = 'ai-chat-bubble system-msg';
    errBubble.innerHTML = `<span style="color:var(--critical)">⚠️ Ollama is offline or unreachable</span>
      <div class="ai-offline-banner" style="margin-top:8px">
        <span>🔌</span>
        <span>Ollama connection failed. Start with: <code>ollama serve</code> and ensure model is pulled: <code>ollama pull llama3.2</code></span>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">
        <strong>Offline Guidance for ${context.cve || 'this vulnerability'}:</strong><br>
        ${generateOfflineGuidance(context)}
      </div>`;
    body.appendChild(errBubble);
    body.scrollTop = body.scrollHeight;
  });
}

function showAITyping() {
  const body = document.getElementById('aiPanelBody');
  const typing = document.createElement('div');
  typing.className = 'ai-typing';
  typing.id = 'ai-typing-indicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;
  return typing;
}

function removeAITyping(el) {
  if (el && el.parentNode) el.remove();
}

function formatAIResponse(text) {
  if (!text) return '<em style="color:var(--text-muted)">No response received.</em>';
  let html = escHtml(text);
  // Bold: **text**
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Code blocks: ``` ... ```
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escHtml(code.trim())}</code></pre>`;
  });
  // Inline code: `code`
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-hover);padding:1px 4px;border-radius:3px;font-family:var(--font-mono);font-size:11px">$1</code>');
  // Numbered lists
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<strong>$1.</strong> $2');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  return html;
}

async function callOllama(systemPrompt, userPrompt) {
  return window.OllamaClient.callOllama(systemPrompt, userPrompt);
}

function generateOfflineGuidance(ctx) {
  const cve = ctx.cve || '';
  const sev = (ctx.severity || '').toLowerCase();
  const os = (ctx.os || '').toLowerCase();

  let guidance = '<ul style="margin-top:4px;padding-left:20px">';
  guidance += '<li>Review the vendor advisory for ' + escHtml(cve) + '</li>';
  guidance += '<li>Check your patch management system (SCCM/WSUS) for available updates</li>';

  if (os.includes('windows')) {
    guidance += '<li>Run: <code>Get-HotFix</code> to check currently installed updates</li>';
    guidance += '<li>Use <code>Get-WindowsUpdate</code> from PSWindowsUpdate module</li>';
  } else if (os.includes('linux')) {
    guidance += '<li>Run: <code>yum check-update</code> or <code>apt list --upgradable</code></li>';
  } else if (os.includes('mac')) {
    guidance += '<li>Run: <code>softwareupdate -l</code> to list available updates</li>';
  }

  if (sev === 'critical') {
    guidance += '<li><strong style="color:var(--critical)">⚠️ CRITICAL:</strong> Prioritize immediate patching, consider temporary mitigations</li>';
  }

  guidance += '<li>Document all changes and test in staging first</li>';
  guidance += '</ul>';
  return guidance;
}

// ════ Change Request System ═══════════════════════════════════
function getChangeRequests() {
  try { return JSON.parse(localStorage.getItem(KEYS.CHANGE_REQUESTS) || '[]'); }
  catch(e) { return []; }
}
function saveChangeRequests(crs) {
  localStorage.setItem(KEYS.CHANGE_REQUESTS, JSON.stringify(crs));
}

// ShieldView writes draft CRs to this collection
function createChangeRequest(cve, solution, affectedAssets, severity) {
  const crs = getChangeRequests();
  const cr = {
    id: 'CR-' + (1000 + crs.length + 1),
    cve: cve,
    solution: solution || 'Apply vendor patch',
    affectedAssets: affectedAssets || [],
    severity: severity || 'Medium',
    draftedAt: new Date().toISOString(),
    status: 'draft'
  };
  crs.push(cr);
  saveChangeRequests(crs);
  return cr;
}

function renderChangeRequests() {
  const crs = getChangeRequests();
  window.__allCRs = crs;

  var html = `<div class="filter-group">
    <input class="search-input" id="cr-search" placeholder="Search CVE or solution..." oninput="renderCRTable()">
    <select class="filter-select" id="cr-status" onchange="renderCRTable()">
      <option value="all">All Statuses</option>
      <option value="draft">Draft</option>
      <option value="submitted">Submitted</option>
      <option value="approved">Approved</option>
      <option value="scheduled">Scheduled</option>
      <option value="implemented">Implemented</option>
    </select>
    <span class="ml-auto" style="font-size:12px;color:var(--text-muted)">${crs.length} change requests</span>
  </div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="renderMaintenanceWindowEditor()">⚙️ Maintenance Windows</button>
    <button class="btn btn-sm" onclick="loadDemoChangeRequests()">📋 Load Demo CRs</button>
    <button class="btn btn-sm btn-ghost" onclick="if(confirm('Clear all change requests?')){localStorage.removeItem(KEYS.CHANGE_REQUESTS);renderChangeRequests();}">🗑️ Clear All</button>
  </div>
  <div style="overflow-x:auto;margin-top:12px"><table id="cr-table">
  <tr><th>ID</th><th>CVE</th><th>Solution</th><th>Assets</th><th>Severity</th><th>Status</th><th>Drafted</th></tr>
  <tbody id="cr-tbody"></tbody></table></div>`;

  document.getElementById('page-change-requests').innerHTML = html;
  renderCRTable();
}

function renderCRTable() {
  var q = document.getElementById('cr-search')?.value?.toLowerCase() || '';
  var st = document.getElementById('cr-status')?.value || 'all';
  var all = window.__allCRs || [];
  var filtered = all.filter(function(cr) {
    if (st !== 'all' && cr.status !== st) return false;
    if (!q) return true;
    return (cr.cve||'').toLowerCase().indexOf(q) >= 0 ||
           (cr.solution||'').toLowerCase().indexOf(q) >= 0 ||
           (cr.id||'').toLowerCase().indexOf(q) >= 0;
  });

  function crStatusBadge(s) {
    var cls = {'draft':'cr-status-draft','submitted':'cr-status-submitted','approved':'cr-status-approved','scheduled':'cr-status-scheduled','implemented':'cr-status-implemented'};
    return '<span class="badge ' + (cls[s]||'badge-info') + '">' + (s||'draft') + '</span>';
  }
  function sevClassCR(s) { return (s||'medium').toLowerCase(); }

  var rows = filtered.map(function(cr) {
    var assetCount = Array.isArray(cr.affectedAssets) ? cr.affectedAssets.length : (cr.affectedAssets || 0);
    var drafted = cr.draftedAt ? cr.draftedAt.slice(0,16).replace('T',' ') : '—';
    return '<tr class="clickable" onclick="viewChangeRequest(\'' + cr.id + '\')">' +
      '<td class="mono text-link">' + (cr.id||'—') + '</td>' +
      '<td class="mono">' + (cr.cve||'—') + '</td>' +
      '<td>' + ((cr.solution||'').substring(0,40)) + '...</td>' +
      '<td>' + assetCount + '</td>' +
      '<td><span class="badge badge-' + sevClassCR(cr.severity) + '">' + (cr.severity||'Medium') + '</span></td>' +
      '<td>' + crStatusBadge(cr.status) + '</td>' +
      '<td style="font-size:12px;color:var(--text-muted)">' + drafted + '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('cr-tbody').innerHTML = rows || '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">No change requests found. Load demo data or create from ShieldView findings.</td></tr>';
}

function viewChangeRequest(id) {
  var crs = getChangeRequests();
  var cr = crs.find(function(x) { return x.id === id; });
  if (!cr) return;

  function crStatusBadge(s) {
    var cls = {'draft':'cr-status-draft','submitted':'cr-status-submitted','approved':'cr-status-approved','scheduled':'cr-status-scheduled','implemented':'cr-status-implemented'};
    return '<span class="badge ' + (cls[s]||'badge-info') + '">' + (s||'draft') + '</span>';
  }
  function sevClassCR(s) { return (s||'medium').toLowerCase(); }

  var assetCount = Array.isArray(cr.affectedAssets) ? cr.affectedAssets.length : (cr.affectedAssets || 0);
  var drafted = cr.draftedAt ? cr.draftedAt.slice(0,16).replace('T',' ') : '—';

  // Determine available actions based on status
  var actions = '<div class="btn-group">';
  if (cr.status === 'draft') {
    actions += '<button class="btn btn-sm btn-primary" onclick="advanceCRStatus(\'' + cr.id + '\',\'submitted\')">📤 Submit for Approval</button>';
  } else if (cr.status === 'submitted') {
    actions += '<button class="btn btn-sm btn-primary" onclick="advanceCRStatus(\'' + cr.id + '\',\'approved\')">✅ Approve</button>';
    actions += '<button class="btn btn-sm" onclick="advanceCRStatus(\'' + cr.id + '\',\'draft\')">↩ Return to Draft</button>';
  } else if (cr.status === 'approved') {
    actions += '<button class="btn btn-sm btn-primary" onclick="openScheduleDeployment(\'' + cr.id + '\')">📅 Schedule Deployment</button>';
    actions += '<button class="btn btn-sm" onclick="advanceCRStatus(\'' + cr.id + '\',\'submitted\')">↩ Return to Submitted</button>';
  } else if (cr.status === 'scheduled') {
    actions += '<button class="btn btn-sm btn-primary" onclick="implementCR(\'' + cr.id + '\')">🚀 Implement Deployment</button>';
    actions += '<button class="btn btn-sm" onclick="advanceCRStatus(\'' + cr.id + '\',\'approved\')">↩ Return to Approved</button>';
  } else if (cr.status === 'implemented') {
    actions += '<span style="color:var(--installed);font-weight:600;font-size:13px">✅ Implemented</span>';
  }
  actions += '<button class="btn btn-sm btn-ghost" onclick="if(confirm(\'Delete this CR?\')){deleteCR(\'' + cr.id + '\');navigateTo(\'change-requests\')}">🗑️ Delete</button>';
  actions += '</div>';

  // Affected assets table
  var assetsHTML = '';
  if (Array.isArray(cr.affectedAssets) && cr.affectedAssets.length > 0) {
    assetsHTML = '<div class="card"><div class="card-title">Affected Assets (' + cr.affectedAssets.length + ')</div><div style="overflow-x:auto"><table><tr><th>Asset</th></tr>';
    cr.affectedAssets.forEach(function(a) {
      assetsHTML += '<tr><td class="mono">' + (a||'—') + '</td></tr>';
    });
    assetsHTML += '</table></div></div>';
  }

  var html = `<button class="btn btn-sm btn-ghost" onclick="navigateTo('change-requests')">← Back to Change Requests</button>
<div class="card" style="margin-top:12px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
  <h2 style="font-size:18px">${cr.id}</h2>
  ${crStatusBadge(cr.status)}
  <span class="badge badge-${sevClassCR(cr.severity)}" style="margin-left:4px">${cr.severity||'Medium'}</span>
</div>
<div class="grid-2" style="margin-bottom:12px">
  <div><span style="color:var(--text-muted);font-size:12px">CVE</span><br><span class="mono">${cr.cve||'—'}</span></div>
  <div><span style="color:var(--text-muted);font-size:12px">Solution</span><br>${(cr.solution||'—').substring(0,50)}</div>
  <div><span style="color:var(--text-muted);font-size:12px">Affected Assets</span><br>${assetCount}</div>
  <div><span style="color:var(--text-muted);font-size:12px">Severity</span><br>${cr.severity||'Medium'}</div>
  <div><span style="color:var(--text-muted);font-size:12px">Drafted</span><br>${drafted}</div>
  <div><span style="color:var(--text-muted);font-size:12px">Status</span><br>${crStatusBadge(cr.status)}</div>
</div>
<div class="card" style="margin-bottom:12px">
  <div class="card-title">Solution Details</div>
  <p style="font-size:13px;color:var(--text-secondary);white-space:pre-wrap">${cr.solution||'No solution specified'}</p>
</div>
${actions}
</div>
${assetsHTML}`;

  document.getElementById('page-change-request-detail').innerHTML = html;
  navigateTo('change-request-detail');
}

function advanceCRStatus(id, newStatus) {
  var crs = getChangeRequests();
  var idx = crs.findIndex(function(x) { return x.id === id; });
  if (idx < 0) return;
  crs[idx].status = newStatus;
  saveChangeRequests(crs);
  showToast('Change Request ' + id + ' → ' + newStatus);
  viewChangeRequest(id);
}

function deleteCR(id) {
  var crs = getChangeRequests().filter(function(x) { return x.id !== id; });
  saveChangeRequests(crs);
  showToast('Deleted ' + id);
}

// CR → Deployment conversion
function openScheduleDeployment(crId) {
  var crs = getChangeRequests();
  var cr = crs.find(function(x) { return x.id === crId; });
  if (!cr) return;

  var windows = getMaintenanceWindows();
  var blackouts = getBlackoutDates();

  // Build modal HTML
  var overlay = document.createElement('div');
  overlay.className = 'mw-modal-overlay';
  overlay.id = 'mw-modal-overlay';

  var modal = document.createElement('div');
  modal.className = 'mw-modal';

  // Check if current time is in a maintenance window or blackout
  var now = new Date();
  var dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var todayName = dayNames[now.getDay()];
  var timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  var inWindow = false;
  var windowName = '';
  windows.forEach(function(w) {
    if (w.dayOfWeek === todayName && timeStr >= w.startTime && timeStr <= w.endTime) {
      inWindow = true;
      windowName = w.name;
    }
  });

  var inBlackout = false;
  var blackoutReason = '';
  var nowStr = now.toISOString().slice(0,10);
  blackouts.forEach(function(b) {
    if (nowStr >= (b.start||'').slice(0,10) && nowStr <= (b.end||'').slice(0,10)) {
      inBlackout = true;
      blackoutReason = b.reason || 'Blackout period';
    }
  });

  var statusHTML = '';
  if (inBlackout) {
    statusHTML = '<div class="mw-warning">⚠️ <strong>Blackout active:</strong> ' + blackoutReason + ' — deploying outside maintenance window</div>';
  } else if (inWindow) {
    statusHTML = '<div class="mw-ok">✅ Inside maintenance window: <strong>' + windowName + '</strong> (' + todayName + ' ' + timeStr + ')</div>';
  } else {
    statusHTML = '<div class="mw-warning">⚠️ Outside maintenance windows. You can still schedule, but it\'s not recommended.</div>';
  }

  // Build window selector
  var windowOptions = windows.map(function(w) {
    return '<option value="' + w.name + '">' + w.name + ' — ' + w.dayOfWeek + ' ' + w.startTime + '-' + w.endTime + ' (' + (w.timezone||'UTC') + ')</option>';
  }).join('');

  modal.innerHTML = `<h3>📅 Schedule Deployment for ${cr.cve}</h3>
  <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">Select a maintenance window and schedule this change request for deployment.</p>
  ${statusHTML}
  <div class="mw-field">
    <label>Maintenance Window</label>
    <select id="mw-select">${windowOptions || '<option value="">No windows defined</option>'}</select>
  </div>
  <div class="mw-field">
    <label>Deployment Note (optional)</label>
    <input type="text" id="mw-note" placeholder="e.g., Patch for CVE-2026-...">
  </div>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn btn-primary" id="mw-schedule-btn">✅ Schedule Deployment</button>
    <button class="btn" id="mw-cancel-btn">Cancel</button>
    <button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="closeMWModal();renderMaintenanceWindowEditor()">⚙️ Manage Windows</button>
  </div>`;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeMWModal(); });
  document.getElementById('mw-cancel-btn').addEventListener('click', closeMWModal);
  document.getElementById('mw-schedule-btn').addEventListener('click', function() {
    var note = document.getElementById('mw-note').value || '';
    scheduleDeploymentFromCR(crId, note);
    closeMWModal();
  });
}

function closeMWModal() {
  var overlay = document.getElementById('mw-modal-overlay');
  if (overlay) overlay.remove();
}

function scheduleDeploymentFromCR(crId, note) {
  var crs = getChangeRequests();
  var cr = crs.find(function(x) { return x.id === crId; });
  if (!cr) return;

  // Advance CR status to scheduled
  cr.status = 'scheduled';
  saveChangeRequests(crs);

  // Create deployment entry
  var depId = 'DEP-' + (2000 + deployments.length + 1);
  deployments.push({
    id: depId,
    package: cr.cve + ' Fix',
    type: 'Change Request Deployment',
    targetCount: Array.isArray(cr.affectedAssets) ? cr.affectedAssets.length : 1,
    successRate: 0,
    start: new Date().toISOString().slice(0,16).replace('T',' '),
    end: '-',
    status: 'In Progress',
    fromCR: crId,
    note: note
  });

  // Also push to remediation queue
  try {
    var queue = JSON.parse(localStorage.getItem(KEYS.REMEDIATION_QUEUE) || '[]');
    if (!queue.find(function(i) { return i.cve === cr.cve && i.status === 'pending'; })) {
      var item = buildCanonicalQueueItem({
        id: crId,
        cve: cr.cve,
        name: cr.solution || cr.cve,
        affectedAssets: cr.affectedAssets || [],
        coverage: 0
      }, 'RemFlow (CR: ' + crId + ')');
      if (!isCanonicalRemediation(item)) throw new Error('canonical remediation validation failed');
      queue.push(item);
      localStorage.setItem(KEYS.REMEDIATION_QUEUE, JSON.stringify(queue));
    }
  } catch(e) {}

  showToast('📅 ' + crId + ' scheduled for deployment (' + depId + ')');
  viewChangeRequest(crId);
}

function implementCR(crId) {
  var crs = getChangeRequests();
  var cr = crs.find(function(x) { return x.id === crId; });
  if (!cr) return;

  // Mark as implemented
  cr.status = 'implemented';
  saveChangeRequests(crs);

  // Mark any associated deployments as completed
  deployments.forEach(function(d) {
    if (d.fromCR === crId) {
      d.status = 'Completed';
      d.end = new Date().toISOString().slice(0,16).replace('T',' ');
      d.successRate = randInt(92, 100);
    }
  });

  // Mark queue items as deployed
  try {
    var queue = readRemediationQueue();
    queue.forEach(function(q) {
      if (q.cve === cr.cve) {
        q.status = 'deployed';
        q.completedAt = new Date().toISOString();
      }
    });
    localStorage.setItem(KEYS.REMEDIATION_QUEUE, JSON.stringify(queue));
  } catch(e) {}

  showToast('🚀 ' + crId + ' implemented successfully');
  viewChangeRequest(crId);
}

// ════ Maintenance Windows ═══════════════════════════════════

}

  localStorage.setItem(KEYS.MAINTENANCE_WINDOWS, JSON.stringify(windows));
}

function getBlackoutDates() {
  try { return JSON.parse(localStorage.getItem(KEYS.BLACKOUT_DATES) || '[]'); }
  catch(e) { return []; }
}
function saveBlackoutDates(blackouts) {

}

function closeMWEditor() {
  var overlay = document.getElementById('mw-editor-overlay');
  if (overlay) overlay.remove();
}

function addMaintenanceWindowUI() {
  var name = document.getElementById('mw-add-name').value.trim();
  var day = document.getElementById('mw-add-day').value;
  var start = document.getElementById('mw-add-start').value;
  var end = document.getElementById('mw-add-end').value;
  var tz = document.getElementById('mw-add-tz').value.trim() || 'UTC';
  if (!name || !day || !start || !end) { showToast('⚠️ All fields required'); return; }
  var windows = getMaintenanceWindows();
  // Replace existing window with same name
  var idx = windows.findIndex(function(w) { return w.name === name; });
  if (idx >= 0) windows.splice(idx, 1);
  windows.push({ name: name, dayOfWeek: day, startTime: start, endTime: end, timezone: tz });
  saveMaintenanceWindows(windows);
  showToast('✅ Maintenance window added: ' + name);
}

function deleteMaintenanceWindow(name) {
  var windows = getMaintenanceWindows().filter(function(w) { return w.name !== name; });
  saveMaintenanceWindows(windows);
  showToast('Deleted maintenance window: ' + name);
}

function addBlackoutDateUI() {
  var start = document.getElementById('bo-add-start').value;
  var end = document.getElementById('bo-add-end').value;
  var reason = document.getElementById('bo-add-reason').value.trim();
  if (!start || !end) { showToast('⚠️ Start and end dates required'); return; }
  var blackouts = getBlackoutDates();
  blackouts.push({ start: start, end: end, reason: reason || 'No reason' });
  saveBlackoutDates(blackouts);
  showToast('✅ Blackout date added');
}

function deleteBlackoutDate(idx) {
  var blackouts = getBlackoutDates();
  blackouts.splice(idx, 1);
  saveBlackoutDates(blackouts);
  showToast('Deleted blackout date');
}

// ════ Demo Data Loaders ════════════════════════════════════
function loadDemoChangeRequests() {
  var crs = getChangeRequests();
  if (crs.length > 0) {
    if (!confirm('Demo data will be appended to existing ' + crs.length + ' CRs. Continue?')) return;
  }
  var demos = [];
  for (var i = 0; i < 8; i++) {
    var cve = pick(CVE_IDS);
    var assetCount = randInt(3, 15);
    var assets = [];
    for (var j = 0; j < assetCount; j++) assets.push(pick(HOSTS));
    demos.push({
      id: 'CR-' + (1000 + crs.length + i + 1),
      cve: cve,
      solution: CVE_NAMES[cve] + ' — Apply ' + (KBS[cve]||'vendor patch') + ' to ' + assetCount + ' affected assets',
      affectedAssets: [...new Set(assets)],
      severity: pick(SEVS),
      draftedAt: ago(randInt(1, 168)),
      status: pick(['draft','draft','draft','submitted','submitted','approved','approved','scheduled'])
    });
  }
  crs.push.apply(crs, demos);
  saveChangeRequests(crs);
  renderChangeRequests();
  showToast('📋 Loaded ' + demos.length + ' demo change requests');
}

// Init — check hash first for deep links
function handleHash(){
  const hash=location.hash.replace(/^#\/?/,'').split('/');
  const page=hash[0]||'dashboard';
  const param=hash.slice(1).join('/');
  if(page==='finding'&&param) setTimeout(()=>viewFinding(decodeURIComponent(param)),100);
  else if(page==='deployment'&&param) setTimeout(()=>viewDeployment(decodeURIComponent(param)),100);
  else if(page==='remediation'&&param) setTimeout(()=>viewRemediation(decodeURIComponent(param)),100);
  else if(page==='deploy-fix'&&param) setTimeout(()=>showDeployFix(decodeURIComponent(param)),100);
  else if(page==='create-remediation'&&param) setTimeout(()=>showCreateRemediation(decodeURIComponent(param)),100);
  else if(page==='asset'&&param) setTimeout(()=>viewAsset(decodeURIComponent(param)),100);
  else navigateTo(page);
}
// Update URL on nav so deep links work
let _settingHash=false;
const _origNav=navigateTo;
navigateTo=function(page,param){
  _origNav(page,param);
  if(_settingHash) return;
  _settingHash=true;
  const hashMap={'finding-detail':'finding','deployment-detail':'deployment','remediation-detail':'remediation','create-remediation':'create-remediation','deploy-fix':'deploy-fix','asset-detail':'asset','datasources':'datasources','pipeline':'pipeline','change-requests':'change-requests','change-request-detail':'change-request-detail'};
  const hashPage=hashMap[page]||page;
  try{
    if(param) history.replaceState(null,'','#/'+hashPage+'/'+encodeURIComponent(param));
    else if(page!=='dashboard') history.replaceState(null,'','#/'+hashPage);
    else history.replaceState(null,'','#');
  }catch(e){}
  setTimeout(()=>{_settingHash=false},100);
};
document.getElementById('syncTime').textContent='Last sync: '+ago(0);
handleHash();

// Debug error catcher
window.onerror = function(msg, file, line, col, err) {
  console.error('RemFlow error:', msg, file, line, col, err);
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--critical-bg);border:1px solid var(--critical);color:var(--text-primary);padding:12px 20px;border-radius:var(--radius);font-size:13px;z-index:999;box-shadow:var(--shadow);max-width:600px';
  toast.innerHTML = `<strong>⚠️ Error</strong><br><span style="font-size:11px">${msg || 'Unknown error'} (${file}:${line})</span>`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 8000);
  return false;
};
